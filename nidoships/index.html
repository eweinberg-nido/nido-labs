        // Robust parser that handles strict JSON, JS objects, const declarations, etc.
        function parseFirebaseConfigText(rawInput) {
            if (!rawInput || typeof rawInput !== "string") return null;
            let clean = rawInput.trim();
            
            // 1. Try strict JSON parse first
            try {
                const obj = JSON.parse(clean);
                if (obj && (obj.apiKey || obj.projectId)) return obj;
            } catch (e) {}

            // 2. Remove "const firebaseConfig =" or "var firebaseConfig =" or export
            clean = clean.replace(/^(export\s+)?(const|var|let)\s+firebaseConfig\s*=\s*/i, "");
            clean = clean.replace(/;\s*$/, "").trim();

            // 3. Try safe JavaScript evaluator
            try {
                const fn = new Function("return (" + clean + ");");
                const res = fn();
                if (res && (res.apiKey || res.projectId)) return res;
            } catch (e) {}

            // 4. Regex fallback extraction
            const extractKey = (keyName) => {
                const match = rawInput.match(new RegExp('["\']?' + keyName + '["\']?\\s*:\\s*["\']([^"\'\\n,]+)["\']', "i"));
                return match ? match[1].trim() : "";
            };

            const config = {
                apiKey: extractKey("apiKey"),
                authDomain: extractKey("authDomain"),
                projectId: extractKey("projectId"),
                storageBucket: extractKey("storageBucket"),
                messagingSenderId: extractKey("messagingSenderId"),
                appId: extractKey("appId")
            };

            if (config.apiKey && config.projectId) return config;
            return null;
        }

                                    <span className="bg-slate-100 text-slate-700 text-xs font-semibold px-3 py-1 rounded-full border border-slate-200">
                                        ⚡ {opportunity.frequency}

                            <div className="flex justify-between items-start gap-4">
                                <h2 className="text-2xl sm:text-3xl font-black text-slate-900 tracking-tight leading-tight">
                                    {opportunity.title}

                                <div className="flex items-center gap-2 shrink-0">
                                    {onToggleBookmark && (
                                        <button 
                                            onClick={() => onToggleBookmark(opportunity.id)}

                                                isBookmarked ? 'bg-amber-50 border-amber-300 text-amber-600' : 'border-slate-200 text-slate-400 hover:text-slate-600'
                                            }`}

                                        >
                                            {isBookmarked ? '★ Saved' : '☆ Save'}

                                    <button 
                                        onClick={onClose}
                                        className="p-2 rounded-xl text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition-colors"
                                        aria-label="Close detail modal"
                                    >
                                        ✕
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div className="p-6 sm:p-8 grid grid-cols-1 md:grid-cols-12 gap-8">
                            <div className="md:col-span-7 space-y-6">
                                <div className="flex flex-wrap gap-2 text-xs font-semibold">
                                    {opportunity.curricularContext && (
                                        <span className="bg-slate-100 text-slate-800 px-3 py-1.5 rounded-xl border border-slate-200">
                                            📚 {opportunity.curricularContext}
                                        </span>
                                    )}
                                    {opportunity.creditStatus && (
                                        <span className={`px-3 py-1.5 rounded-xl border ${
                                            opportunity.creditStatus.includes('Credit Available') 
                                                ? 'bg-emerald-50 text-emerald-800 border-emerald-200' 
                                                : 'bg-slate-100 text-slate-700 border-slate-200'
                                        }`}>
                                            🎓 {opportunity.creditStatus}
                                        </span>
                                    )}
                                    {opportunity.financialDetails === 'Cost / Fee Required' && (
                                        <span className="bg-rose-50 text-rose-800 border-rose-200 px-3 py-1.5 rounded-xl border font-bold">
                                            💳 Cost / Fee Required
                                        </span>
                                    )}
                                    {opportunity.financialDetails === 'Paid Position' && (
                                        <span className="bg-emerald-50 text-emerald-900 border-emerald-300 px-3 py-1.5 rounded-xl border font-bold">
                                            💰 Paid Position
                                        </span>
                                    )}
                                    {opportunity.travelRequirements && opportunity.travelRequirements !== 'No Travel Required' && (
                                        <span className="bg-sky-50 text-sky-800 border-sky-200 px-3 py-1.5 rounded-xl border font-bold">
                                            ✈️ {opportunity.travelRequirements}
                                        </span>
                                    )}
                                </div>

                                <div>
                                    <h4 className="text-xs font-bold text-slate-400 tracking-wider uppercase mb-2">Overview</h4>
                                    <p className="text-slate-700 leading-relaxed text-base font-normal">
                                        {opportunity.description}
                                    </p>
                                </div>

                                {opportunity.detailedOverview && (
                                    <div className="pt-4 border-t border-slate-100">
                                        <h4 className="text-xs font-bold text-slate-400 tracking-wider uppercase mb-2">Full Details & Expectations</h4>
                                        <div 
                                            className="text-slate-600 text-sm leading-relaxed prose max-w-none space-y-2"
                                            dangerouslySetInnerHTML={{ __html: opportunity.detailedOverview }}
                                        ></div>
                                    </div>
                                )}

                                {opportunity.requiredResources && opportunity.requiredResources.length > 0 && (
                                    <div className="pt-4 border-t border-slate-100">
                                        <h4 className="text-xs font-bold text-slate-400 tracking-wider uppercase mb-2.5">Prerequisites & Needed Resources</h4>
                                        <div className="flex flex-wrap gap-2">
                                            {opportunity.requiredResources.map((res, i) => (
                                                <span key={i} className="inline-flex items-center gap-1.5 bg-slate-100 text-slate-700 text-xs px-3 py-1.5 rounded-xl border border-slate-200 font-medium">
                                                    <span className="text-emerald-600 font-bold">✓</span> {res}
                                                </span>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {opportunity.reviewNotes && (
                                    <div className="p-4 rounded-2xl bg-rose-50 border border-rose-200 text-rose-800 text-xs space-y-1">
                                        <div className="font-bold flex items-center gap-1">⚠️ Moderator Feedback / Required Changes:</div>
                                        <p>{opportunity.reviewNotes}</p>
                                    </div>
                                )}

                                <div className="pt-4 flex flex-wrap gap-3">
                                    {opportunity.externalUrl && (
                                        <a 
                                            href={opportunity.externalUrl}
                                            target="_blank"
                                            rel="noreferrer"
                                            className="inline-flex items-center gap-2 px-6 py-3 bg-brand-600 hover:bg-brand-700 text-white font-semibold text-sm rounded-xl transition-all shadow-sm"
                                        >
                                            <span>Visit Opportunity Link</span>
                                            <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                                            </svg>
                                        </a>
                                    )}
                                    <a 
                                        href={`mailto:${opportunity.contactEmail}?subject=Inquiry regarding Nidoship: ${encodeURIComponent(opportunity.title)}`}
                                        className="inline-flex items-center justify-center gap-2 px-6 py-3 bg-slate-900 hover:bg-slate-800 text-white font-medium text-sm rounded-xl transition-all shadow-sm"
                                    >
                                        <span>Contact Host</span>
                                        <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 002-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                                        </svg>
                                    </a>
                                </div>
                            </div>

                            <div className="md:col-span-5 bg-slate-50 p-6 rounded-3xl border border-slate-100 space-y-5 self-start">
                                <div>
                                    <h5 className="text-xs font-bold text-slate-400 tracking-wider uppercase mb-2">Eligible Grades</h5>
                                    <div className="flex flex-wrap gap-1.5">
                                        {opportunity.grades && opportunity.grades.map(g => (
                                            <span key={g} className="bg-white border border-slate-200 text-slate-800 font-semibold text-xs px-2.5 py-1 rounded-lg shadow-2xs">
                                                {g}
                                            </span>
                                        ))}
                                    </div>
                                </div>

                                <div>
                                    <h5 className="text-xs font-bold text-slate-400 tracking-wider uppercase mb-2">Tags</h5>
                                    <div className="flex flex-wrap gap-1.5">
                                        {opportunity.tags && opportunity.tags.map(t => (
                                            <span key={t} className="bg-slate-200/70 text-slate-700 font-medium text-xs px-2.5 py-0.5 rounded-md">
                                                {t.startsWith('#') ? t : `#${t}`}
                                            </span>
                                        ))}
                                    </div>
                                </div>

                                <div className="grid grid-cols-2 gap-3 text-xs">
                                    <div>
                                        <h5 className="font-bold text-slate-400 uppercase tracking-wider mb-0.5">Dates</h5>
                                        <p className="font-bold text-slate-900">
                                            {opportunity.startDate ? new Date(opportunity.startDate).toLocaleDateString(undefined, {month: 'short', day: 'numeric', year: 'numeric'}) : 'Flexible'} 
                                            {opportunity.endDate ? ` - ${new Date(opportunity.endDate).toLocaleDateString(undefined, {month: 'short', day: 'numeric', year: 'numeric'})}` : ''}
                                        </p>
                                    </div>
                                    <div>
                                        <h5 className="font-bold text-slate-400 uppercase tracking-wider mb-0.5">Duration</h5>
                                        <p className="font-bold text-slate-900">{opportunity.duration || 'Flexible'}</p>
                                    </div>
                                </div>

                                <div className="text-xs">
                                    <h5 className="font-bold text-slate-400 uppercase tracking-wider mb-0.5">Time Commitment</h5>
                                    <p className="font-semibold text-slate-900">{opportunity.timeCommitment || 'Flexible'}</p>
                                </div>

                                <div className="text-xs">
                                    <h5 className="font-bold text-slate-400 uppercase tracking-wider mb-0.5">Location & Office</h5>
                                    <p className="font-semibold text-slate-900">{opportunity.location}</p>
                                    {opportunity.officeLocation && (
                                        <p className="text-slate-500 mt-0.5 font-medium">📍 {opportunity.officeLocation}</p>
                                    )}
                                </div>

                                <div className="border-t border-slate-200 pt-4 text-xs">
                                    <h5 className="font-bold text-slate-400 uppercase tracking-wider mb-1">Host / Primary Contact</h5>
                                    <p className="font-bold text-slate-900 mb-0.5">{opportunity.contactOrg}</p>
                                    <a href={`mailto:${opportunity.contactEmail}`} className="text-brand-600 hover:text-brand-700 font-medium underline break-all">
                                        {opportunity.contactEmail}
                                    </a>
                                </div>

                                {opportunity.submitterName && (
                                    <div className="border-t border-slate-200 pt-3 text-[11px] text-slate-400">
                                        <span>Submitted to portal by: </span>
                                        <span className="font-semibold text-slate-600">{opportunity.submitterName}</span>
                                    </div>
                                )}
                            </div>
                        </div>

                    </div>
                </div>
            );
        }

        // =========================================================================
        // 5. SUBMISSION & EDITING FORM
        // =========================================================================

        function SubmissionForm({ initialData = null, currentUser, onSubmitSuccess, onCancel, isEditing = false }) {
            const [formData, setFormData] = React.useState(initialData || {
                title: '',
                types: ['internship'],
                description: '',
                detailedOverview: '',
                grades: [],
                tags: '',
                startDate: '',
                endDate: '',
                travelRequirements: 'No Travel Required',
                duration: '',
                timeCommitment: '',
                location: 'On Campus',
                travelRequirements: 'No Travel Required',
                officeLocation: '',
                contactOrg: '',
                contactEmail: currentUser?.email || '',
                submitterName: currentUser?.displayName || '',
                submitterEmail: currentUser?.email || '',
                submitterUid: currentUser?.uid || '',
                externalUrl: '',
                frequency: 'Ongoing',
                curricularContext: 'Extra-curricular',
                creditStatus: 'No Credit',
                financialDetails: 'Unpaid / Volunteer',
                pathway: 'STEM & Tech',
                requiredResources: ['Nido Student Account']
            });

            const [errors, setErrors] = React.useState({});
            const [customPrereq, setCustomPrereq] = React.useState('');

            const handleGradeToggle = (grade) => {
                setFormData(prev => {
                    const current = prev.grades || [];
                    if (current.includes(grade)) {
                        return { ...prev, grades: current.filter(g => g !== grade) };
                    } else {
                        return { ...prev, grades: [...current, grade] };
                    }
                });
            };

            const handleResourceToggle = (item) => {
                setFormData(prev => {
                    const current = prev.requiredResources || [];
                    if (current.includes(item)) {
                        return { ...prev, requiredResources: current.filter(r => r !== item) };
                    } else {
                        return { ...prev, requiredResources: [...current, item] };
                    }
                });
            };

            const handleAddCustomPrereq = () => {
                if (!customPrereq.trim()) return;
                setFormData(prev => ({
                    ...prev,
                    requiredResources: [...(prev.requiredResources || []), customPrereq.trim()]
                }));
                setCustomPrereq('');
            };

            const insertFormat = (tagOpen, tagClose = '') => {
                const textarea = document.getElementById('detailedOverviewInput');
                if (!textarea) return;
                const start = textarea.selectionStart;
                const end = textarea.selectionEnd;
                const selectedText = formData.detailedOverview.substring(start, end);
                const replacement = `${tagOpen}${selectedText}${tagClose}`;
                const newText = formData.detailedOverview.substring(0, start) + replacement + formData.detailedOverview.substring(end);
                setFormData({ ...formData, detailedOverview: newText });
            };

            const addLinkPrompt = () => {
                const url = prompt('Enter link URL (e.g. https://example.com):');
                if (url) {
                    const label = prompt('Enter link display text:', 'Click Here') || url;
                    insertFormat(`<a href="${url}" target="_blank" class="text-brand-600 underline">${label}</a>`);
                }
            };

            const validate = () => {
                const newErrors = {};
                if (!formData.title.trim()) newErrors.title = 'Title is required';
                if (!formData.description.trim()) newErrors.description = 'Short teaser overview is required';
                if (!formData.contactOrg.trim()) newErrors.contactOrg = 'Host/Organization Name is required';
                if (!formData.contactEmail.trim() || !formData.contactEmail.includes('@')) newErrors.contactEmail = 'Valid contact email is required';
                if (!formData.grades || formData.grades.length === 0) newErrors.grades = 'Select at least one eligible grade';
                
                setErrors(newErrors);
                return Object.keys(newErrors).length === 0;
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!validate()) return;

                const tagArray = typeof formData.tags === 'string'
                    ? formData.tags.split(',').map(t => t.trim()).filter(t => t.length > 0).map(t => t.startsWith('#') ? t : `#${t}`)
                    : formData.tags;

                const newOpportunity = {
                    ...formData,
                    id: formData.id || 'opp-' + Date.now().toString(),
                    tags: tagArray && tagArray.length > 0 ? tagArray : ['#campus', '#opportunity'],
                    startDate: formData.startDate || '',
                    endDate: formData.endDate || '',
                    travelRequirements: formData.travelRequirements || 'No Travel Required',
                    duration: formData.duration || 'Flexible',
                    timeCommitment: formData.timeCommitment || 'Flexible',
                    location: formData.location || 'On Campus',
                    submitterUid: formData.submitterUid || currentUser?.uid || 'guest-author',
                    submitterName: formData.submitterName || currentUser?.displayName || 'Community Poster',
                    submitterEmail: formData.submitterEmail || currentUser?.email || '',
                    status: isEditing ? (formData.status || 'pending') : 'pending',
                    reviewNotes: '',
                    createdAt: formData.createdAt || new Date().toISOString().split('T')[0],
                    updatedAt: new Date().toISOString().split('T')[0]
                };

                onSubmitSuccess(newOpportunity);
            };

            return (
                <div className="max-w-4xl mx-auto py-8 px-4 sm:px-6 animate-fade-in">
                    <div className="bg-white rounded-3xl border border-slate-200 shadow-sm p-6 sm:p-10">
                        <div className="mb-8 border-b border-slate-100 pb-6">
                            <span className="text-xs font-bold text-brand-600 tracking-wider uppercase">
                                {isEditing ? 'Administrative Edit' : 'Propose an Opportunity'}
                            </span>
                            <h1 className="text-2xl sm:text-3xl font-extrabold text-slate-900 mt-1">
                                {isEditing ? 'Edit Nidoship Details' : 'Submit a Nidoship Opportunity'}
                            </h1>
                            <p className="text-slate-500 text-sm mt-1">
                                {isEditing 
                                    ? 'Update details, logistics, contacts, or requirements for this listing.' 
                                    : 'Staff, faculty, alumni, and community mentors can propose student opportunities. Submissions will be reviewed by portal admins before going live.'}
                            </p>
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-8">
                            
                            {/* SECTION 1: SUBMITTER INFO */}
                            <div className="space-y-4 bg-slate-50/70 p-5 rounded-2xl border border-slate-200/80">
                                <div className="flex items-center justify-between">
                                    <h3 className="text-xs font-bold text-slate-700 uppercase tracking-wider">
                                        1. Submitter Details (Person entering this form)
                                    </h3>
                                    <span className="text-[11px] text-slate-400">Can differ from host contact</span>
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-700 mb-1">Submitter Name & Title</label>
                                        <input 
                                            type="text" 
                                            placeholder="e.g. Jane Doe (Business Office / Alumni)"
                                            value={formData.submitterName}
                                            onChange={e => setFormData({ ...formData, submitterName: e.target.value })}
                                            className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-brand-500 bg-white"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-700 mb-1">Submitter Email</label>
                                        <input 
                                            type="email" 
                                            placeholder="jdoe@nido.cl"
                                            value={formData.submitterEmail}
                                            onChange={e => setFormData({ ...formData, submitterEmail: e.target.value })}
                                            className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-brand-500 bg-white"
                                        />
                                    </div>
                                </div>
                            </div>

                            {/* SECTION 2: BASIC OVERVIEW & TAXONOMY */}
                            <div className="space-y-5">
                                <h3 className="text-sm font-bold text-slate-900 uppercase tracking-wider border-b border-slate-100 pb-2">
                                    2. Opportunity Overview & Category
                                </h3>

                                <div>
                                    <label className="block text-sm font-semibold text-slate-800 mb-1.5">
                                        Opportunity Title <span className="text-rose-500">*</span>
                                    </label>
                                    <input 
                                        type="text" 
                                        placeholder="e.g. Accounting Google Sheets Builder or BioTech Lab Externship"
                                        value={formData.title}
                                        onChange={e => setFormData({ ...formData, title: e.target.value })}
                                        className={`w-full px-4 py-3 rounded-xl border text-sm focus:outline-none transition-all ${
                                            errors.title ? 'border-rose-400 ring-2 ring-rose-100' : 'border-slate-200 focus:border-brand-500'
                                        }`}
                                    />
                                    {errors.title && <p className="text-xs text-rose-500 mt-1">{errors.title}</p>}
                                </div>

                                <div>
                                    <label className="block text-sm font-semibold text-slate-800 mb-2">
                                        Opportunity Category <span className="text-rose-500">*</span>
                                    </label>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-3">
                                        {Object.entries(CATEGORIES).map(([key, cat]) => {
                                            const isSelected = formData.types?.includes(key);
                                            return (
                                                <button
                                                    type="button"
                                                    key={key}
                                                    onClick={() => {
                                                        const current = formData.types || [];
                                                        if (current.includes(key)) {
                                                            setFormData({ ...formData, types: current.filter(t => t !== key) });
                                                        } else {
                                                            setFormData({ ...formData, types: [...current, key] });
                                                        }
                                                    }}
                                                    className={`p-3 rounded-2xl border text-left transition-all text-xs font-semibold flex flex-col justify-between gap-1.5 ${
                                                        isSelected 
                                                            ? `${cat.pillBorder} ring-2 ring-slate-900/10 shadow-sm font-bold`
                                                            : 'border-slate-200 hover:border-slate-300 text-slate-600 bg-white'
                                                    }`}
                                                >
                                                    <div className="flex items-center justify-between">
                                                        <span className="text-base">{cat.icon}</span>
                                                        <span className={`w-2 h-2 rounded-full ${cat.dotColor}`}></span>
                                                    </div>
                                                    <div>
                                                        <div className="font-bold text-slate-900">{cat.label}</div>
                                                        <div className="text-[10px] text-slate-500 font-normal leading-tight mt-0.5">{cat.sublabel}</div>
                                                    </div>
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>

                                <div>
                                    <label className="block text-sm font-semibold text-slate-800 mb-1">
                                        Short Summary / Card Teaser <span className="text-rose-500">*</span>
                                    </label>
                                    <textarea 
                                        rows="2"
                                        placeholder="Concise 1-2 sentence hook displayed on portal cards..."
                                        value={formData.description}
                                        onChange={e => setFormData({ ...formData, description: e.target.value })}
                                        className={`w-full px-4 py-2.5 rounded-xl border text-sm focus:outline-none transition-all ${
                                            errors.description ? 'border-rose-400' : 'border-slate-200 focus:border-brand-500'
                                        }`}
                                    ></textarea>
                                    {errors.description && <p className="text-xs text-rose-500 mt-1">{errors.description}</p>}
                                </div>

                                <div>
                                    <div className="flex items-center justify-between mb-1.5">
                                        <label className="block text-sm font-semibold text-slate-800">
                                            Full Details & Learning Objectives
                                        </label>
                                        <div className="flex items-center gap-1 bg-slate-100 p-1 rounded-lg text-xs font-bold">
                                            <button type="button" onClick={() => insertFormat('<b>', '</b>')} className="px-2 py-0.5 hover:bg-white rounded" title="Bold">B</button>
                                            <button type="button" onClick={() => insertFormat('<i>', '</i>')} className="px-2 py-0.5 hover:bg-white rounded italic" title="Italic">I</button>
                                            <button type="button" onClick={() => insertFormat('<ul><li>', '</li></ul>')} className="px-2 py-0.5 hover:bg-white rounded" title="Bullet list">• List</button>
                                            <button type="button" onClick={addLinkPrompt} className="px-2 py-0.5 hover:bg-white text-brand-600 rounded" title="Insert Link">🔗 Link</button>
                                        </div>
                                    </div>
                                    <textarea 
                                        id="detailedOverviewInput"
                                        rows="4"
                                        placeholder="Detailed expectations, weekly routine, deliverables, learning goals... HTML supported."
                                        value={formData.detailedOverview}
                                        onChange={e => setFormData({ ...formData, detailedOverview: e.target.value })}
                                        className="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-brand-500 transition-all font-mono text-xs"
                                    ></textarea>
                                </div>

                                <div>
                                    <label className="block text-sm font-semibold text-slate-800 mb-1">
                                        External Website or Direct Application Link (Optional)
                                    </label>
                                    <input 
                                        type="url" 
                                        placeholder="https://external-organization.org/apply"
                                        value={formData.externalUrl}
                                        onChange={e => setFormData({ ...formData, externalUrl: e.target.value })}
                                        className="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-brand-500"
                                    />
                                </div>
                            </div>

                            {/* SECTION 3: ATTRIBUTES & CLASSIFICATION */}
                            <div className="space-y-5">
                                <h3 className="text-sm font-bold text-slate-900 uppercase tracking-wider border-b border-slate-100 pb-2">
                                    3. Logistics, Credit & Pathway
                                </h3>

                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-700 mb-1.5">Event Frequency</label>
                                        <select 
                                            value={formData.frequency}
                                            onChange={e => setFormData({ ...formData, frequency: e.target.value })}
                                            className="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-xs font-semibold bg-white"
                                        >
                                            <option value="Ongoing">Ongoing / Recurring</option>
                                            <option value="One-off">One-off / Single Event</option>
                                        </select>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-700 mb-1.5">Context</label>
                                        <select

        function FirebaseConfigModal({ isOpen, onClose, onSaveConfig, isConnected, activeConfig }) {
            const [rawConfig, setRawConfig] = React.useState('');
            const [parsedPreview, setParsedPreview] = React.useState(null);

            React.useEffect(() => {
                if (isOpen) {
                    const currentCfg = activeConfig || DEFAULT_FIREBASE_CONFIG;
                    setRawConfig(JSON.stringify(currentCfg, null, 2));
                    setParsedPreview(currentCfg);
                }
            }, [isOpen, activeConfig]);

            const handleTextChange = (text) => {
                setRawConfig(text);
                const parsed = parseFirebaseConfigText(text);
                setParsedPreview(parsed);
            };

            if (!isOpen) return null;

            const handleSave = () => {
                const parsed = parseFirebaseConfigText(rawConfig);
                if (parsed) {
                    onSaveConfig(parsed);
                    onClose();
                } else {
                    alert('Could not detect a valid Firebase config. Please ensure apiKey and projectId are present.');
                }
            };

            const handleResetDefault = () => {
                setRawConfig(JSON.stringify(DEFAULT_FIREBASE_CONFIG, null, 2));
                setParsedPreview(DEFAULT_FIREBASE_CONFIG);
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/70 backdrop-blur-sm animate-fade-in">
                    <div className="bg-white rounded-3xl max-w-lg w-full p-6 sm:p-8 space-y-5 shadow-2xl border border-slate-100">
                        <div className="flex justify-between items-start">
                            <div>
                                <h3 className="text-xl font-black text-slate-900">Firebase Firestore Setup</h3>
                                <p className="text-xs text-slate-500 mt-0.5">Paste your Firebase configuration below (JSON or JS object)</p>
                            </div>
                            <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-sm">✕</button>
                        </div>

                        {parsedPreview ? (
                            <div className="p-3 bg-emerald-50 rounded-2xl border border-emerald-200 text-emerald-900 text-xs flex items-center gap-2">
                                <span className="w-2 h-2 rounded-full bg-emerald-500"></span>
                                <div>
                                    <span className="font-bold">Valid Firebase Config Detected!</span>
                                    <div className="text-[11px] text-emerald-700 mt-0.5">
                                        Project ID: <strong>{parsedPreview.projectId}</strong> | Auth Domain: <strong>{parsedPreview.authDomain}</strong>
                                    </div>
                                </div>
                            </div>
                        ) : (
                            <div className="p-3 bg-amber-50 rounded-2xl border border-amber-200 text-amber-900 text-xs">
                                <strong>⚠️ Paste your Firebase web app config object here.</strong> Unquoted JavaScript syntax from Firebase Console is automatically supported.
                            </div>
                        )}

                        <div>
                            <div className="flex justify-between items-center mb-1">
                                <label className="block text-xs font-bold text-slate-700">Configuration Text</label>
                                <button 
                                    type="button" 
                                    onClick={handleResetDefault}
                                    className="text-[11px] text-brand-600 hover:underline font-semibold"
                                >
                                    Reset to nidoships project
                                </button>
                            </div>
                            <textarea 
                                rows="8"
                                value={rawConfig}
                                onChange={e => handleTextChange(e.target.value)}
                                placeholder="Paste { apiKey: '...', projectId: '...' }"
                                className="w-full font-mono text-xs p-3.5 bg-slate-50 rounded-xl border border-slate-200 focus:outline-none focus:bg-white focus:border-brand-500"
                            ></textarea>
                        </div>

                        <div className="flex justify-end gap-3 pt-2">
                            <button 
                                type="button" 
                                onClick={onClose}
                                className="px-5 py-2.5 rounded-xl border border-slate-200 text-xs font-semibold text-slate-600 hover:bg-slate-50"
                            >
                                Cancel
                            </button>
                            <button 
                                type="button" 
                                onClick={handleSave}

                                className={`px-6 py-2.5 rounded-xl text-white text-xs font-bold transition-all shadow-sm ${
