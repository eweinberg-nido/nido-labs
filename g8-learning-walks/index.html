<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>G8 Learning Walks</title>
<style>
:root{
  --bg:#f6f7f9;--surface:#fff;--soft:#eef1f5;--ink:#1d2532;--muted:#5d6878;--line:#d7dde5;
  --accent:#2457c5;--accent-ink:#fff;--accent-soft:#e7eefc;
  --good:#1e7a46;--goodbg:#e6f4ec;--warn:#8a5a00;--warnbg:#fff3d6;--bad:#b42318;--badbg:#fdecea;
  --bA:#4c78a8;--bB:#d9741f;--bC:#4e9a47;--bD:#cc4848;--bE:#3f9993;--bF:#9c5e8f;--bG:#b8921a;--bH:#86654d;
  --win:rgba(36,87,197,.18);--radius:6px;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#12161d;--surface:#1a2029;--soft:#232a35;--ink:#e6e9ee;--muted:#9aa5b4;--line:#323b48;
  --accent:#7aa2ff;--accent-ink:#0b1020;--accent-soft:#1f2b47;
  --good:#6fd39a;--goodbg:#173325;--warn:#f0bf5a;--warnbg:#3a2e14;--bad:#ff8a7e;--badbg:#3d1d1a;
  --win:rgba(122,162,255,.22);color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding:0 20px}
.small{font-size:13px}.muted{color:var(--muted)}
h1{font-size:20px;margin:0;font-weight:650;letter-spacing:-.01em}
h2{font-size:22px;margin:0;font-weight:650;letter-spacing:-.01em}
h3{font-size:16px;margin:0 0 8px;font-weight:600}

.topbar{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.topbar .wrap{display:flex;align-items:center;gap:24px;min-height:56px;flex-wrap:wrap}
.tabs{display:flex;gap:2px}
.tabs button{border:0;background:none;padding:16px 12px;border-bottom:2px solid transparent;color:var(--muted);cursor:pointer}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.saved{margin-left:auto}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:6px 12px;cursor:pointer}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{padding:3px 9px;font-size:13px}
.link{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-size:13px}
input[type=text],input[type=number],input[type=time],input[type=search],select{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:5px 8px}
input[type=number]{width:64px}

.blk{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 5px;border-radius:4px;color:#fff;font-weight:700;font-size:13px}
.b-A{background:var(--bA)}.b-B{background:var(--bB)}.b-C{background:var(--bC)}.b-D{background:var(--bD)}
.b-E{background:var(--bE)}.b-F{background:var(--bF)}.b-G{background:var(--bG)}.b-H{background:var(--bH)}

/* date strip */
.strip{display:flex;gap:6px;overflow-x:auto;padding:16px 0 12px;scrollbar-width:thin}
.dchip{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-start;gap:4px;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:6px 10px 7px;cursor:pointer;min-width:86px;position:relative}
.dchip .dd{font-size:13px;white-space:nowrap}
.dchip .row{display:flex;gap:6px;align-items:center}
.dchip .cnt{font-size:12px;color:var(--muted)}
.dchip.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.dchip.wk{margin-left:10px}
.dchip.full .cnt{color:var(--good)}
.dchip.gap .cnt{color:var(--warn)}

/* day header + timeline */
.dayhead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:6px 0 12px}
.dayhead .sub{color:var(--muted);margin-top:2px}
.special{background:var(--warnbg);color:var(--warn);border-radius:var(--radius);padding:6px 10px;margin:0 0 12px;font-size:14px}
.timeline{position:relative;height:74px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:18px;overflow:hidden}
.tl-seg{position:absolute;top:22px;height:32px;border-radius:4px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;opacity:.38}
.tl-seg.hot{opacity:1}
.tl-seg.x{background:var(--soft);color:var(--muted);font-weight:500;font-size:12px;opacity:1}
.tl-win{position:absolute;top:8px;bottom:8px;background:var(--win);border-left:2px solid var(--accent);border-right:2px solid var(--accent)}
.tl-winlbl{position:absolute;top:4px;font-size:12px;color:var(--accent);font-weight:600;white-space:nowrap;transform:translateX(-50%)}
.tl-tick{position:absolute;bottom:3px;font-size:11px;color:var(--muted);transform:translateX(-50%)}

.plan{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:20px;align-items:start;padding-bottom:40px}
@media (max-width:900px){.plan{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.panel-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}
.panel-h h3{margin:0;margin-right:auto}
.panel-b{padding:12px 14px}
.empty{color:var(--muted);padding:18px 4px;text-align:center}

.walk{border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;margin-bottom:10px;background:var(--surface)}
.walk.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.w-head{display:flex;align-items:baseline;gap:8px}
.w-name{border:0;background:none;padding:0;font-weight:650;font-size:16px;cursor:pointer;color:var(--ink)}
.w-name:hover{color:var(--accent)}
.w-head .del{margin-left:auto}
.icon{border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:0 4px}
.icon:hover{color:var(--bad)}
.w-meta{display:flex;gap:14px;align-items:center;margin:8px 0;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.w-meta label{display:flex;gap:6px;align-items:center}
.slot{border:1.5px dashed var(--line);border-radius:var(--radius);min-height:58px;transition:border-color .12s,background .12s}
.slot.over,#cand-panel.over{border-color:var(--accent);background:var(--accent-soft)}
body.dragging .slot{border-color:var(--muted)}
.empty-slot{color:var(--muted);font-size:13px;padding:18px 12px;text-align:center}
.assigned{padding:9px 11px;cursor:grab;border-radius:var(--radius)}
.assigned:active{cursor:grabbing}
.notes{width:100%;margin-top:8px}
.partner{font-size:12px;color:var(--muted);margin-top:6px}

.c-title{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.c-sub{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:2px}
.cat{font-size:11px;border:1px solid var(--line);border-radius:99px;padding:0 7px;color:var(--muted)}
.flags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.flag{font-size:12px;border-radius:4px;padding:1px 7px}
.flag.good{background:var(--goodbg);color:var(--good)}
.flag.warn{background:var(--warnbg);color:var(--warn)}
.flag.block{background:var(--badbg);color:var(--bad)}
.flag.info{background:var(--soft);color:var(--muted)}

.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:2px 11px;font-size:13px;cursor:pointer}
.pill[aria-pressed=true]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.filters input[type=search]{margin-left:auto;width:220px}
.cand{display:grid;grid-template-columns:4px 1fr auto;gap:0 12px;padding:10px 14px 10px 0;border-bottom:1px solid var(--line);align-items:start}
.cand:last-child{border-bottom:0}
.cand::before{content:"";align-self:stretch;border-radius:0 3px 3px 0}
.cand.lvl-good::before{background:var(--good)}
.cand.lvl-warn::before{background:var(--warn)}
.cand.lvl-block::before{background:var(--bad)}
.cand.lvl-block{opacity:.72}
.cand[draggable=true]{cursor:grab}
.cand .btn{margin-top:2px}
.hidden-note{padding:10px 14px;font-size:13px;color:var(--muted);border-top:1px solid var(--line)}

/* other tabs */
.page{padding:22px 0 50px}
.page-h{display:flex;align-items:flex-end;gap:16px;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin:0 0 18px}
.stat b{display:block;font-size:24px;font-weight:650;line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px}
.adv{padding:10px 0;border-top:1px solid var(--line)}
.adv:first-of-type{border-top:0}
.adv-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.adv-h input{width:120px}.adv-h input.room{width:80px}
.prog{display:flex;gap:10px;font-size:13px;margin-left:auto}
.prog .done{color:var(--good)}
.wl{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.wl button{text-align:left;border:1px solid var(--line);background:var(--soft);border-radius:4px;padding:4px 8px;font-size:13px;cursor:pointer;display:flex;gap:8px;align-items:center}
.wl button:hover{border-color:var(--accent)}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;font-size:13px;color:var(--muted);background:var(--soft);position:sticky;top:0}
tr:last-child td{border-bottom:0}
.bt{border:0;width:24px;height:24px;border-radius:4px;color:#fff;font-weight:700;font-size:12px;cursor:pointer;margin:0 2px 2px 0}
.bt.off{background:var(--soft)!important;color:var(--bad);text-decoration:line-through}
.bt.none{background:transparent!important;color:var(--line);cursor:default;border:1px dashed var(--line)}
.st-yes{color:var(--good)}.st-maybe{color:var(--warn)}.st-no{color:var(--bad)}.st-unknown{color:var(--muted)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.settings{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;margin-bottom:22px}
.settings .panel-b label{display:flex;gap:10px;align-items:center;margin-bottom:10px}

dialog{border:1px solid var(--line);border-radius:10px;padding:0;background:var(--surface);color:var(--ink);width:min(560px,94vw)}
dialog::backdrop{background:rgba(10,15,25,.4)}
.dlg-h{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.dlg-h h3{margin:0;margin-right:auto}
.dlg-b{padding:14px 18px}
.dlg-b .grid{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;align-items:center;margin-bottom:14px}
.dlg-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.wk-row{display:grid;grid-template-columns:110px 34px 1fr;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.note{font-size:13px;color:var(--warn);margin-top:8px}

#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:var(--radius);font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.print-only{display:none}
@media print{
  body{background:#fff;color:#000;font-size:12px}
  .topbar,.no-print,[data-page]:not(#page-print){display:none!important}
  #page-print{display:block!important;padding:0}
  .tbl-wrap{border:0}
  th{background:#eee;color:#000}
  .print-only{display:block}
  h2.ptitle{font-size:16px;margin:16px 0 6px;break-after:avoid}
  .pbreak{break-before:page}
}
</style>
</head>

</main>
<dialog id="dlg-week" aria-labelledby="wk-title"></dialog>

  const h = hostOf(sec.teacher), r = [];
  let lvl = "good";
  const raise = l => { if(l === "block") lvl = "block"; else if(l === "warn" && lvl === "good") lvl = "warn"; };
  if(h.status === "no"){ r.push(["block","Not hosting"]); raise("block"); }
  else if(h.status === "unknown"){ r.push(["block","No survey response"]); raise("block"); }
  else if(h.status === "maybe"){ r.push(["warn","Maybe: wants more information"]); raise("warn"); }
  if(h.exclude.includes(sec.block)){ r.push(["block","Block "+sec.block+" not ideal for visitors"]); raise("block"); }
  const taken = S.walks.find(w => w.date === date && w.sectionId === sec.id && (!walk || w.id !== walk.id));
  if(taken){ r.push(["block","Already hosting "+advName(taken.advisor)]); raise("block"); }
  if(walk){
    const prev = S.walks.filter(w => w.id !== walk.id && w.advisor === walk.advisor && w.sectionId && secById[w.sectionId] && secById[w.sectionId].teacher === sec.teacher);
    if(prev.length){
      if(h.ambassador) r.push(["good","Ambassador: return visit"]);
      else { r.push(["warn", advName(walk.advisor)+"’s group visits on "+fmtDate(prev[0].date)]); raise("warn"); }
    }
  }
  if(h.ambassador && !r.some(x => x[1].startsWith("Ambassador"))) r.push(["good","Ambassador"]);
  const v = teacherVisits(sec.teacher, walk && walk.id);
  if(v) r.push(["info", v+" other visit"+(v>1?"s":"")+" planned"]);
  if(sec.students != null && sec.students < 10) r.push(["info","Small class ("+sec.students+")"]);
  return {lvl, r, taken};
}
const lvlRank = {good:0, warn:1, block:2};
function score(sec, walk){
  const e = evalSection(sec, walk.date, walk), c = catOf(sec);
  if(e.lvl === "block") return -1e9;
  let sc = 0;
  if(walk.focus === "Core" && c === "Core") sc += 20;
  if(walk.focus === "Elective" && c === "Elective") sc += 20;
  if(walk.focus === "Open" && (c === "Core" || c === "Elective")) sc += 8;
  if(c === "IB") sc -= 10;
  if(c === "Support") sc -= 15;
  if(e.lvl === "warn") sc -= 6;
  sc -= 4 * teacherVisits(sec.teacher, walk.id);
  if(sec.students != null && sec.students < 10) sc -= 3;
  return sc;
}

/* ---------- UI state ---------- */
const UI = {tab:"plan", date:null, sel:null, cat:"All", showAll:false, q:"", hostQ:"", hostF:"all", pMode:"date", pFrom:null, pTo:null, wk:null};
function pickStartDate(){
  const t = todayISO();
  const withWalks = walkDays.find(d => d.date >= t && walksOn(d.date).length);
  const next = walkDays.find(d => d.date >= t);
  return (withWalks || next || walkDays[0]).date;
}

      <div class="toolbar" style="margin:0">
        <button class="btn" data-act="prevday" aria-label="Previous walk day">‹</button>
        <input type="date" id="jump" value="${d.date}" min="${walkDays[0].date}" max="${walkDays[walkDays.length-1].date}" aria-label="Jump to date">

          <select id="add-adv" aria-label="Advisor">${advOpts}</select>

          <button class="btn" data-act="planweek">Plan a week…</button>
        </div>

          ${ws.some(w => !w.sectionId) ? `<button class="btn primary" data-act="suggest">Suggest classes for open walks</button>` : ""}

function isoWeek(iso){ const t = new Date(iso+"T12:00:00"); t.setDate(t.getDate() - ((t.getDay()+6)%7)); return t.toISOString().slice(0,10); }

function timeline(d){
  const wed = wdNum(d.date) === 3;
  const L = d.order.split("");
  const segs = wed
    ? [[L[0],"08:05","09:25"],[L[1],"09:35","10:55",1],["Break","10:55","11:20"],[L[2],"11:20","12:35"],["Lunch","12:35","13:15"],[L[3],"13:15","14:30"]]
    : [[L[0],"08:05","09:25"],[L[1],"09:40","11:00",1],["Flex","11:05","11:40"],[L[2],"11:45","13:05"],["Lunch","13:05","13:45"],[L[3],"13:55","15:15"]];
  const t0 = 470, t1 = 925, pct = m => ((m - t0) / (t1 - t0) * 100).toFixed(2) + "%";
  const w = (a,b) => ((mins(b) - mins(a)) / (t1 - t0) * 100).toFixed(2) + "%";
  const segHtml = segs.map(([lab,a,b,hot]) => lab.length === 1
    ? `<div class="tl-seg b-${lab} ${hot?"hot":""}" style="left:${pct(mins(a))};width:${w(a,b)}" title="Block ${lab}, ${a}–${b}">${lab}</div>`
    : `<div class="tl-seg x" style="left:${pct(mins(a))};width:${w(a,b)}">${lab}</div>`).join("");
  const ws = mins(S.msStart), we = mins(S.msEnd);
  const ticks = ["08:00","09:00","10:00","11:00","12:00","13:00","14:00","15:00"].map(t => `<span class="tl-tick" style="left:${pct(mins(t))}">${t.replace(/^0/,"")}</span>`).join("");
  return `<div class="timeline" role="img" aria-label="High school day: blocks ${L.join(", ")}. The middle school walk window ${S.msStart} to ${S.msEnd} falls in block ${L[1]}.">
    ${segHtml}
    <div class="tl-win" style="left:${pct(ws)};width:${((we - ws) / (t1 - t0) * 100).toFixed(2)}%"></div>
    <span class="tl-winlbl" style="left:${pct((ws+we)/2)}">Walk ${S.msStart.replace(/^0/,"")}–${S.msEnd.replace(/^0/,"")}</span>
    ${ticks}</div>`;
}

function flags(r){ return r.length ? `<div class="flags">${r.map(([k,t]) => `<span class="flag ${k}">${esc(t)}</span>`).join("")}</div>` : ""; }

function walkCard(w){

  let slot;
  if(sec){
    const e = evalSection(sec, w.date, w);

      <div class="c-sub"><span>${esc(sec.teacher)}</span><span>Room ${esc(sec.room || "not listed")}</span><span>${sec.students ?? "?"} HS students</span></div>

    slot = `<div class="empty-slot">${UI.sel === w.id ? "Drag a class here, or press Assign on a class" : "Drag a class here"}</div>`;
  }

  const p = partnersOf(w.advisor);
  return `<article class="walk ${UI.sel===w.id?"sel":""}">
    <div class="w-head">
      <button class="w-name" data-select="${w.id}" aria-pressed="${UI.sel===w.id}" title="Select to assign classes by clicking">${esc(a.name)}</button>
      <span class="muted small">leaves from ${esc(a.room)}</span>

      <label>Walk type <select data-wf="focus" data-id="${w.id}">${focusOpts}</select></label>
      <label><input type="number" min="1" max="15" value="${w.students}" data-wf="students" data-id="${w.id}"> G8 students</label>
    </div>
    <div class="slot" data-dropwalk="${w.id}">${slot}</div>
    <input type="text" class="notes" placeholder="Notes for this walk" value="${esc(w.notes)}" data-wf="notes" data-id="${w.id}">
    ${p.length ? `<div class="partner">Rest of the advisory stays with ${esc(p.join(" or "))}.</div>` : ""}
  </article>`;
}

function candidatePanel(d, selWalk){
  const ctxWalk = selWalk || null;
  const all = liveSections().filter(s => s.block === d.second).map(s => ({s, e:evalSection(s, d.date, ctxWalk), c:catOf(s)}));
  const q = UI.q.trim().toLowerCase();
  const byCat = all.filter(x => UI.cat === "All" || x.c === UI.cat)
                   .filter(x => !q || (x.s.course+" "+x.s.teacher+" "+(x.s.room||"")).toLowerCase().includes(q));
  const shown = byCat.filter(x => UI.showAll || x.e.lvl !== "block")
    .sort((a,b) => lvlRank[a.e.lvl]-lvlRank[b.e.lvl] || teacherVisits(a.s.teacher)-teacherVisits(b.s.teacher) || CATS.indexOf(a.c)-CATS.indexOf(b.c) || a.s.course.localeCompare(b.s.course));
  const hidden = byCat.length - shown.length;
  const pills = ["All", ...CATS].map(c => {
    const n = c === "All" ? all.filter(x=>x.e.lvl!=="block").length : all.filter(x => x.c === c && x.e.lvl !== "block").length;
    return `<button class="pill" data-cat="${c}" aria-pressed="${UI.cat===c}">${c} ${n}</button>`;
  }).join("");
  const rows = shown.map(({s,e,c}) => `
    <div class="cand lvl-${e.lvl}" ${e.taken ? "" : `draggable="true" data-drag="sec:${s.id}"`}>
      <div>
        <div class="c-title"><b>${esc(s.course)}</b><span class="cat">${esc(c)}</span></div>
        <div class="c-sub"><span>${esc(s.teacher)}</span><span>Room ${esc(s.room || "not listed")}</span><span>${s.students ?? "?"} students</span></div>
        ${flags(e.r)}
      </div>
      ${e.taken ? "" : `<button class="btn sm" data-assign="${s.id}">Assign</button>`}
    </div>`).join("");
  return `<div class="panel" id="cand-panel">
    <div class="panel-h"><h3>Classes meeting in block <span class="blk b-${d.second}">${d.second}</span></h3>
      <span class="small muted">${selWalk ? "Checking against "+esc(advName(selWalk.advisor))+"’s walk" : "Select a walk to check repeat visits"}</span></div>
    <div class="filters">${pills}<input type="search" id="cand-q" placeholder="Search course, teacher, room" value="${esc(UI.q)}" aria-label="Search classes"></div>
    <div>${rows || `<div class="empty">No classes match. Try another filter or show unavailable classes.</div>`}</div>
    ${hidden || UI.showAll ? `<div class="hidden-note">${UI.showAll ? "Showing every class, including unavailable ones." : hidden+" unavailable class"+(hidden>1?"es":"")+" hidden (not hosting, block not ideal, or already taken)."}
       <button class="link" data-act="toggleall">${UI.showAll ? "Hide unavailable" : "Show them"}</button></div>` : ""}
  </div>`;
}

/* ---------- actions: plan ---------- */
function newWalk(date, advisor, focus){
  return {id:"w"+(S.seq++), date, advisor, focus:focus||"Open", students:5, sectionId:null, notes:""};
}
function assign(walkId, secId){
  const w = S.walks.find(x => x.id === walkId), sec = secById[secId];
  if(!w || !sec) return;
  const e = evalSection(sec, w.date, w);
  if(e.taken){ toast(sec.course+" is already hosting "+advName(e.taken.advisor)+". Drag that walk’s class here to swap."); return; }
  if(e.lvl === "block" && !confirm(sec.course+" with "+sec.teacher+": "+e.r.filter(x=>x[0]==="block").map(x=>x[1]).join("; ")+".\n\nAssign anyway?")) return;
  w.sectionId = secId; save(); render();
  toast(sec.course+" assigned to "+advName(w.advisor));
}
function swap(aId, bId){
  const a = S.walks.find(x => x.id === aId), b = S.walks.find(x => x.id === bId);
  if(!a || !b || a === b) return;
  [a.sectionId, b.sectionId] = [b.sectionId, a.sectionId];
  save(); render(); toast("Swapped classes between "+advName(a.advisor)+" and "+advName(b.advisor));
}
function suggest(){
  const open = walksOn(UI.date).filter(w => !w.sectionId);
  let n = 0;
  for(const w of open){
    const cands = liveSections().filter(s => s.block === dayByDate[w.date].second)
      .map(s => ({s, sc:score(s, w)})).filter(x => x.sc > -1e8)
      .sort((a,b) => b.sc - a.sc || a.s.course.localeCompare(b.s.course));
    if(cands.length){ w.sectionId = cands[0].s.id; n++; }
  }
  save(); render();
  toast(n ? "Suggested "+n+" class"+(n>1?"es":"")+". Drag to swap or remove any you don’t want." : "No available classes left in this block.");
}

/* ---------- plan-a-week dialog ---------- */
function openWeek(){
  UI.wk = {g:0, start:UI.date, focus:"Core", assign:null};
  const ws = walksOn(UI.date);
  if(ws.length){ const gi = D.groups.findIndex(g => g.includes(ws[0].advisor)); if(gi >= 0) UI.wk.g = gi; }
  renderWeek(); $("#dlg-week").showModal();
}
function weekDays(){
  const i = Math.max(0, walkDays.findIndex(d => d.date >= UI.wk.start));
  return walkDays.slice(i, i + D.groups[UI.wk.g].length * 2);
}
function renderWeek(){
  const g = D.groups[UI.wk.g], days = weekDays();
  if(!UI.wk.assign || UI.wk.assign.length !== days.length) UI.wk.assign = days.map((_,k) => g[Math.floor(k/2)] || g[g.length-1]);
  const crosses = days.some((d,k) => k && wdNum(d.date) < wdNum(days[k-1].date));
  const gapDays = days.some((d,k) => k && (new Date(d.date) - new Date(days[k-1].date)) / 864e5 > 3);
  const rows = days.map((d,k) => {
    const opts = g.map(id => `<option value="${id}" ${UI.wk.assign[k]===id?"selected":""}>${esc(advName(id))}</option>`).join("") + `<option value="" ${UI.wk.assign[k]===""?"selected":""}>No walk</option>`;
    const clash = UI.wk.assign[k] && S.walks.some(w => w.date === d.date && w.advisor === UI.wk.assign[k]);
    return `<div class="wk-row"><span>${esc(fmtDate(d.date))}</span><span class="blk b-${d.second}">${d.second}</span>
      <span><select data-wka="${k}" aria-label="Advisor on ${esc(fmtDate(d.date))}">${opts}</select>${clash ? ` <span class="small" style="color:var(--warn)">already has a walk</span>` : ""}</span></div>`;
  }).join("");
  const startOpts = walkDays.map(d => `<option value="${d.date}" ${d.date===days[0]?.date?"selected":""}>${esc(fmtDate(d.date))}</option>`).join("");
  const gOpts = D.groups.map((g,i) => `<option value="${i}" ${i===UI.wk.g?"selected":""}>${esc(g.map(advName).join(" & "))}</option>`).join("");
  $("#dlg-week").innerHTML = `
    <div class="dlg-h"><h3 id="wk-title">Plan a week of walks</h3><button class="icon" data-act="closeweek" aria-label="Close">×</button></div>
    <div class="dlg-b">
      <div class="grid">
        <label for="wk-g">Advisors</label><select id="wk-g">${gOpts}</select>
        <label for="wk-s">Starting</label><select id="wk-s">${startOpts}</select>
        <label for="wk-f">Walk type</label><select id="wk-f">${FOCI.map(f=>`<option ${f===UI.wk.focus?"selected":""}>${f}</option>`).join("")}</select>
      </div>
      ${rows}
      ${crosses ? `<div class="note">These days run across a weekend.</div>` : ""}
      ${gapDays ? `<div class="note">There’s a holiday or break inside this stretch.</div>` : ""}
    </div>
    <div class="dlg-f"><button class="btn" data-act="closeweek">Cancel</button><button class="btn primary" data-act="createweek">Add these walks</button></div>`;
}
function createWeek(){
  const days = weekDays(); let n = 0;
  days.forEach((d,k) => {
    const a = UI.wk.assign[k];
    if(!a || S.walks.some(w => w.date === d.date && w.advisor === a)) return;
    S.walks.push(newWalk(d.date, a, UI.wk.focus)); n++;
  });
  save(); $("#dlg-week").close(); UI.date = days[0].date; render();
  toast(n ? "Added "+n+" walk"+(n>1?"s":"") : "No new walks added; those advisors already have walks on these days.");
}

      <div class="stat"><b class="st-yes">${counts.yes}</b><span>Hosting</span></div>
      <div class="stat"><b class="st-maybe">${counts.maybe}</b><span>Maybe</span></div>
      <div class="stat"><b class="st-no">${counts.no}</b><span>Not hosting</span></div>
      <div class="stat"><b>${counts.unknown}</b><span>No response</span></div>
    </div>
    <div class="toolbar">
      <input type="search" id="host-q" placeholder="Search teacher or course" value="${esc(UI.hostQ)}" aria-label="Search teachers">
      <select id="host-f" aria-label="Filter by status">
        ${[["all","Everyone"],["yes","Hosting"],["maybe","Maybe"],["no","Not hosting"],["unknown","No response"]].map(([v,l]) => `<option value="${v}" ${UI.hostF===v?"selected":""}>${l}</option>`).join("")}
      </select>
    </div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Teacher</th><th>Status</th><th>Blocks taught</th><th>Repeat visits</th><th>Visits</th><th>Teaches</th><th>Note</th></tr></thead>
      <tbody>${rows || `<tr><td colspan="7" class="muted">No teachers match.</td></tr>`}</tbody></table></div>`;
}

/* ---------- render: print ---------- */
function renderPrint(){
  const dates = [...new Set(S.walks.map(w => w.date))].sort();
  if(!UI.pFrom) UI.pFrom = dates[0] || walkDays[0].date;
  if(!UI.pTo) UI.pTo = dates[dates.length-1] || walkDays[0].date;
  const ws = S.walks.filter(w => w.date >= UI.pFrom && w.date <= UI.pTo).sort((a,b) => a.date.localeCompare(b.date) || advOrder(a.advisor) - advOrder(b.advisor));
  const opt = v => walkDays.map(d => `<option value="${d.date}" ${d.date===v?"selected":""}>${esc(fmtDate(d.date))}</option>`).join("");
  const cell = w => { const s = w.sectionId && secById[w.sectionId]; return s ? [esc(s.course), esc(s.teacher), esc(s.room||"")] : ["<i>Not assigned</i>","",""]; };
  const time = `${S.msStart}–${S.msEnd}`;
  let body = "";
  if(!ws.length) body = `<p class="muted">No walks in this date range.</p>`;
  else if(UI.pMode === "date"){
    body = `<div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Block</th><th>Advisor</th><th>From</th><th>Students</th><th>Class</th><th>Teacher</th><th>Room</th><th>Notes</th></tr></thead><tbody>
      ${ws.map(w => { const [c,t,r] = cell(w), a = adv(w.advisor); return `<tr><td>${esc(fmtDate(w.date))}</td><td>${dayByDate[w.date].second}</td><td>${esc(a.name)}</td><td>${esc(a.room)}</td><td>${w.students}</td><td>${c}</td><td>${t}</td><td>${r}</td><td>${esc(w.notes)}</td></tr>`; }).join("")}
      </tbody></table></div>`;
  } else if(UI.pMode === "advisor"){
    const ids = [...new Set(ws.map(w => w.advisor))].sort((a,b) => advOrder(a)-advOrder(b));
    body = ids.map((id,i) => { const a = adv(id); return `<div class="${i?"pbreak":""}"><h2 class="ptitle">${esc(a.name)}: learning walks</h2>
      <p class="small">Leave ${esc(a.room)} with your group so you arrive by ${S.msStart}. Back by ${S.msEnd}.</p>
      <div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Walk type</th><th>Students</th><th>Class</th><th>Teacher</th><th>Room</th><th>Notes</th></tr></thead><tbody>
      ${ws.filter(w => w.advisor === id).map(w => { const [c,t,r] = cell(w); return `<tr><td>${esc(fmtDate(w.date))}</td><td>${w.focus}</td><td>${w.students}</td><td>${c}</td><td>${t}</td><td>${r}</td><td>${esc(w.notes)}</td></tr>`; }).join("")}
      </tbody></table></div></div>`; }).join("");
  } else {
    const ts = [...new Set(ws.filter(w => w.sectionId).map(w => secById[w.sectionId].teacher))].sort();
    body = ts.length ? ts.map((t,i) => `<div class="${i?"pbreak":""}"><h2 class="ptitle">Visitors for ${esc(t)}</h2>
      <p class="small">Middle school advisors will bring up to 5 grade 8 students to your class from ${time}.</p>
      <div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Block</th><th>Class</th><th>Room</th><th>Advisor</th><th>Students</th></tr></thead><tbody>
      ${ws.filter(w => w.sectionId && secById[w.sectionId].teacher === t).map(w => { const s = secById[w.sectionId]; return `<tr><td>${esc(fmtDate(w.date))}</td><td>${s.block}</td><td>${esc(s.course)}</td><td>${esc(s.room||"")}</td><td>${esc(advName(w.advisor))}</td><td>${w.students}</td></tr>`; }).join("")}
      </tbody></table></div></div>`).join("") : `<p class="muted">No classes assigned in this range yet.</p>`;
  }
  $("#page-print").innerHTML = `
    <div class="page-h no-print"><h2>Print</h2></div>
    <div class="toolbar no-print">
      <select id="p-mode" aria-label="Layout">
        <option value="date" ${UI.pMode==="date"?"selected":""}>Full schedule by date</option>
        <option value="advisor" ${UI.pMode==="advisor"?"selected":""}>One page per advisor</option>
        <option value="host" ${UI.pMode==="host"?"selected":""}>One page per host teacher</option>
      </select>
      <label class="small">From <select id="p-from">${opt(UI.pFrom)}</select></label>
      <label class="small">to <select id="p-to">${opt(UI.pTo)}</select></label>
      <button class="btn primary" data-act="print">Print</button>
    </div>
    ${UI.pMode === "date" ? `<h2 class="ptitle print-only">G8 learning walks, ${esc(fmtDate(UI.pFrom))} to ${esc(fmtDate(UI.pTo))} (${time})</h2>` : ""}
    ${body}`;
}

/* ---------- render: settings ---------- */
function renderData(){
  const courses = [...new Map(D.sections.map(s => [s.num, s])).values()].sort((a,b) => a.course.localeCompare(b.course));
  const rows = courses.map(s => `<tr><td>${esc(s.course)}</td><td class="small muted">${esc(s.dept||"")}</td>
    <td><select data-catnum="${esc(s.num)}" aria-label="Walk type for ${esc(s.course)}">${CATS.map(c => `<option ${catOf(s)===c?"selected":""}>${c}</option>`).join("")}</select></td></tr>`).join("");
  $("#page-data").innerHTML = `
    <div class="page-h"><h2>Settings</h2></div>
    <div class="settings">
      <div class="panel"><div class="panel-h"><h3>Walk window</h3></div><div class="panel-b">
        <label>Middle school leaves at <input type="time" data-set="msStart" value="${S.msStart}"></label>
        <label>and is back by <input type="time" data-set="msEnd" value="${S.msEnd}"></label>
        <label><input type="checkbox" data-set="hideS2" ${S.hideS2?"checked":""}> Hide semester 2 classes</label>
      </div></div>
      <div class="panel"><div class="panel-h"><h3>Backup</h3></div><div class="panel-b">
        <p class="small muted" style="margin-top:0">Your plan is saved in this browser only. Export a copy to move it to another computer or share it with a colleague.</p>
        <div class="toolbar"><button class="btn" data-act="export">Export plan</button>
        <label class="btn">Import plan<input type="file" id="imp" accept="application/json,.json" hidden></label>
        <button class="btn" data-act="reset" style="color:var(--bad)">Reset to original data</button></div>
      </div></div>
    </div>
    <h3>Course types</h3>
    <p class="small muted" style="margin-top:0">Used for the filters and for suggestions. Core and elective are a first guess; change any course.</p>
    <div class="tbl-wrap" style="max-height:520px;overflow:auto"><table><thead><tr><th>Course</th><th>Department</th><th>Type</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="small muted">Data: PowerSchool master schedule and the HS Timetable Google Calendar (pulled 3 November 2026), host survey from 21–22 October 2026.</p>`;
}

/* ---------- top-level render ---------- */
function render(){
  document.querySelectorAll("[data-tab]").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === UI.tab));
  document.querySelectorAll("[data-page]").forEach(p => p.hidden = p.id !== "page-"+UI.tab);
  ({plan:renderPlan, advisors:renderAdvisors, hosts:renderHosts, print:renderPrint, data:renderData})[UI.tab]();
}
let toastT;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2600); }

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("button,[data-tab]"); if(!t) return;
  const ds = t.dataset;
  if(ds.tab){ UI.tab = ds.tab; render(); return; }
  if(ds.date){ UI.date = ds.date; UI.sel = null; render(); return; }
  if(ds.goto){ UI.date = ds.goto; UI.tab = "plan"; UI.sel = null; render(); return; }
  if(ds.select){ UI.sel = UI.sel === ds.select ? null : ds.select; render(); return; }
  if(ds.delwalk){ const w = S.walks.find(x => x.id === ds.delwalk); if(w && confirm("Delete "+advName(w.advisor)+"’s walk on "+fmtDate(w.date)+"?")){ S.walks = S.walks.filter(x => x !== w); save(); render(); } return; }
  if(ds.unassign){ const w = S.walks.find(x => x.id === ds.unassign); if(w){ w.sectionId = null; save(); render(); } return; }
  if(ds.assign){
    const ws = walksOn(UI.date); let target = UI.sel;
    if(!target){ const open = ws.filter(w => !w.sectionId); if(open.length === 1) target = open[0].id; }
    if(!target){ toast(ws.length ? "Select a walk first by clicking the advisor’s name." : "Add a walk for this day first."); return; }
    assign(target, ds.assign); return;
  }
  if(ds.cat){ UI.cat = ds.cat; render(); return; }
  if(ds.excl){ const h = hostOf(ds.t), b = ds.excl; h.exclude = h.exclude.includes(b) ? h.exclude.filter(x => x !== b) : [...h.exclude, b].sort(); save(); render(); return; }
  switch(ds.act){
    case "addwalk": { const a = $("#add-adv").value; if(S.walks.some(w => w.date === UI.date && w.advisor === a)){ toast(advName(a)+" already has a walk on this day."); return; } const w = newWalk(UI.date, a, "Open"); S.walks.push(w); UI.sel = w.id; save(); render(); break; }
    case "suggest": suggest(); break;
    case "planweek": openWeek(); break;
    case "closeweek": $("#dlg-week").close(); break;
    case "createweek": createWeek(); break;
    case "toggleall": UI.showAll = !UI.showAll; render(); break;
    case "prevday": case "nextday": { const i = walkDays.findIndex(d => d.date === UI.date) + (ds.act === "nextday" ? 1 : -1); if(walkDays[i]){ UI.date = walkDays[i].date; UI.sel = null; render(); } break; }
    case "print": window.print(); break;
    case "export": {
      const blob = new Blob([JSON.stringify(S, null, 2)], {type:"application/json"});
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "g8-learning-walks-"+todayISO()+".json"; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000); toast("Exported plan"); break; }
    case "reset": if(confirm("Replace your whole plan, host settings and course types with the original data? Export a backup first if you want to keep anything.")){ localStorage.removeItem(KEY); load(); UI.date = pickStartDate(); render(); toast("Reset to original data"); } break;
  }
});
document.addEventListener("change", e => {
  const t = e.target, ds = t.dataset;
  if(t.id === "jump"){ const d = walkDays.find(x => x.date >= t.value); if(d){ UI.date = d.date; UI.sel = null; render(); if(d.date !== t.value) toast("No walks that day; showing "+fmtDate(d.date)); } return; }
  if(ds.wf){ const w = S.walks.find(x => x.id === ds.id); if(!w) return; w[ds.wf] = ds.wf === "students" ? Math.max(1, +t.value || 5) : t.value; save(); if(ds.wf !== "notes") render(); return; }
  if(ds.af){ const a = adv(ds.id); a[ds.af] = t.value.trim() || a[ds.af]; save(); return; }
  if(ds.hf){ const h = hostOf(ds.t); h[ds.hf] = ds.hf === "ambassador" ? t.checked : t.value; save(); if(ds.hf !== "note") render(); return; }
  if(ds.catnum){ S.cats[ds.catnum] = t.value; save(); return; }
  if(ds.set){ S[ds.set] = t.type === "checkbox" ? t.checked : t.value; save(); return; }
  if(ds.wka !== undefined){ UI.wk.assign[+ds.wka] = t.value; renderWeek(); return; }
  if(t.id === "wk-g"){ UI.wk.g = +t.value; UI.wk.assign = null; renderWeek(); return; }
  if(t.id === "wk-s"){ UI.wk.start = t.value; UI.wk.assign = null; renderWeek(); return; }
  if(t.id === "wk-f"){ UI.wk.focus = t.value; return; }
  if(t.id === "host-f"){ UI.hostF = t.value; render(); return; }
  if(t.id === "p-mode"){ UI.pMode = t.value; render(); return; }
  if(t.id === "p-from"){ UI.pFrom = t.value; render(); return; }
  if(t.id === "p-to"){ UI.pTo = t.value; render(); return; }
  if(t.id === "imp" && t.files[0]){
    const r = new FileReader();
    r.onload = () => { try{ const o = JSON.parse(r.result); if(!Array.isArray(o.walks)) throw 0; localStorage.setItem(KEY, JSON.stringify(o)); load(); UI.date = pickStartDate(); render(); toast("Imported plan with "+S.walks.length+" walks"); }
      catch(err){ toast("That file isn’t a plan exported from this tool."); } };
    r.readAsText(t.files[0]);
  }
});
let inputT;
document.addEventListener("input", e => {
  const t = e.target;
  if(t.id === "cand-q" || t.id === "host-q"){
    clearTimeout(inputT);
    inputT = setTimeout(() => {
      if(t.id === "cand-q") UI.q = t.value; else UI.hostQ = t.value;
      const pos = t.selectionStart; render(); const n = $("#"+t.id); if(n){ n.focus(); n.setSelectionRange(pos,pos); }
    }, 180);
  }
  if(t.dataset.wf === "notes" || t.dataset.hf === "note"){
    if(t.dataset.wf){ const w = S.walks.find(x => x.id === t.dataset.id); if(w) w.notes = t.value; }
    else hostOf(t.dataset.t).note = t.value;
    clearTimeout(saveTimer); saveTimer = setTimeout(save, 300);
  }
});

/* drag and drop */
let dragPayload = null;
document.addEventListener("dragstart", e => {
  const t = e.target.closest && e.target.closest("[data-drag]"); if(!t) return;
  dragPayload = t.dataset.drag;
  e.dataTransfer.setData("text/plain", dragPayload); e.dataTransfer.effectAllowed = "move";
  document.body.classList.add("dragging");
});
function clearOver(){ document.querySelectorAll(".over").forEach(n => n.classList.remove("over")); }
document.addEventListener("dragend", () => { document.body.classList.remove("dragging"); clearOver(); dragPayload = null; });
function dropZone(el){
  if(!el || !el.closest) return null;
  const s = el.closest("[data-dropwalk]"); if(s) return s;
  if(dragPayload && dragPayload.startsWith("walk:")) return el.closest("#cand-panel");
  return null;
}
document.addEventListener("dragover", e => { const z = dropZone(e.target); if(z){ e.preventDefault(); if(!z.classList.contains("over")){ clearOver(); z.classList.add("over"); } } });
document.addEventListener("dragleave", e => { const z = dropZone(e.target); if(z && !z.contains(e.relatedTarget)) z.classList.remove("over"); });
document.addEventListener("drop", e => {
  const z = dropZone(e.target); if(!z) return; e.preventDefault(); clearOver();
  const p = e.dataTransfer.getData("text/plain") || dragPayload; if(!p) return;
  const [kind, id] = [p.slice(0, p.indexOf(":")), p.slice(p.indexOf(":")+1)];
  if(z.id === "cand-panel" && kind === "walk"){ const w = S.walks.find(x => x.id === id); if(w){ w.sectionId = null; save(); render(); toast("Removed class from "+advName(w.advisor)+"’s walk"); } return; }
  const target = z.dataset.dropwalk;
  if(kind === "sec") assign(target, id);
  else if(kind === "walk" && id !== target) swap(id, target);
});
document.addEventListener("keydown", e => {
  if(UI.tab !== "plan" || /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName) || $("#dlg-week").open) return;
  if(e.key === "ArrowRight" || e.key === "ArrowLeft"){ const i = walkDays.findIndex(d => d.date === UI.date) + (e.key === "ArrowRight" ? 1 : -1); if(walkDays[i]){ UI.date = walkDays[i].date; UI.sel = null; render(); } }
});

load();
UI.date = pickStartDate();
render();
</script>
</body>
</html>
