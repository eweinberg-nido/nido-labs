<style>
:root {
  --bg:#f7f7f5; --panel:#fff; --ink:#1c1c1a; --muted:#6b6b66;
  --line:#e2e2dd; --accent:#2f6f4f; --warn:#9a6a12; --bad:#a33; --chip:#efefeb;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#17181a; --panel:#1f2023; --ink:#e8e8e4; --muted:#9a9a94;
    --line:#32343a; --accent:#6fbf8f; --warn:#d9a441; --bad:#e07a7a; --chip:#2a2c31;
  }
}
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink);
  font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
header { position:sticky; top:0; z-index:5; background:var(--panel);
  border-bottom:1px solid var(--line); padding:14px 16px; }
.row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
h1 { font-size:16px; margin:0 12px 0 0; font-weight:650; letter-spacing:-.01em; }
input, select, button { font:inherit; color:var(--ink); background:var(--panel);
  border:1px solid var(--line); border-radius:7px; padding:6px 9px; }
input[type=search] { min-width:200px; flex:1; }
button { cursor:pointer; }
button:hover { border-color:var(--muted); }
main { padding:16px; max-width:1200px; margin:0 auto; }
.stats { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
.stat { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 12px; }
.stat b { display:block; font-size:19px; font-variant-numeric:tabular-nums; }
.stat span { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.05em; }
.tablewrap { overflow-x:auto; }
table { width:100%; border-collapse:collapse; background:var(--panel);
  border:1px solid var(--line); border-radius:10px; overflow:hidden;
  table-layout:fixed; min-width:760px; }
th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em;
  color:var(--muted); font-weight:600; padding:9px 12px; border-bottom:1px solid var(--line); }
td { padding:9px 12px; border-bottom:1px solid var(--line); vertical-align:top; overflow-wrap:anywhere; }
.code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; color:var(--muted); }
.pill { display:inline-block; font-size:11px; padding:1px 7px; border-radius:99px;
  border:1px solid currentColor; font-weight:600; white-space:nowrap; }
.yes, .found { color:var(--accent); }
.possible { color:var(--warn); }
.no, .missing { color:var(--bad); }
.not_needed { color:var(--muted); }
.why { color:var(--muted); font-size:11.5px; }
.tag { display:inline-block; margin-left:6px; font-size:10px; padding:1px 6px;
  border-radius:99px; background:var(--chip); color:var(--muted); }
a { color:var(--accent); }
.empty { padding:48px 16px; text-align:center; color:var(--muted); }
footer { max-width:1200px; margin:0 auto; padding:8px 16px 32px; color:var(--muted); font-size:11.5px; }
tr.is-na td { opacity:.6; }

tr.course { cursor:pointer; }
tr.course:hover td { background:color-mix(in srgb, var(--accent) 6%, transparent); }
.detail td { background:color-mix(in srgb, var(--ink) 3%, transparent); }
.doc { padding:3px 0; border-top:1px dashed var(--line); font-size:12.5px; }
.doc:first-child { border-top:0; }
/* The rows expand, and nothing else on the page says so. */
.caret { display:inline-block; width:12px; color:var(--muted); font-size:10px;
  transition:transform .12s ease; }
tr.open .caret { transform:rotate(90deg); }
</style>

const LABEL = { yes:'Yes', possible:'Possible', no:'No' };
const open = new Set();

function filtered() {
  const q = $('#q').value.trim().toLowerCase();
  const dept = $('#dept').value, st = $('#status').value;
  return DATA.courses.filter(c => {
    if (dept && c.dept !== dept) return false;
    if (st && c.status !== st) return false;
    if (q && ![c.code, c.name, c.dept, c.folder, ...c.docs.map(d => d.title)]
      .join(' ').toLowerCase().includes(q)) return false;
    return true;
  });
}
function renderStats() {
  const t = { yes:0, possible:0, no:0 };
  for (const c of DATA.courses) t[c.status]++;
  $('#stats').innerHTML = [
    [DATA.courses.length, 'courses'], [t.yes, 'yes'], [t.possible, 'possible'], [t.no, 'no'],
  ].map(([n, l]) => `<div class="stat ${l === 'courses' ? '' : l}"><b>${n}</b><span>${esc(l)}</span></div>`).join('');
}
function detailHtml(c) {
  const docs = c.docs.length
    ? c.docs.map(d => `<div class="doc">${d.url
        ? `<a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.title)}</a>`
        : esc(d.title)}${d.kind === 'materials-page' ? '<span class="tag">materials page</span>' : ''}
        <span class="why">· ${esc(d.why)}</span></div>`).join('')
    : '<div class="why">No documents identified.</div>';
  const weak = c.weak.length
    ? '<div class="why" style="margin-top:8px">Also present, probably IB assessment rather than a scale:</div>' +
      c.weak.map(t => `<div class="doc">${esc(t)}</div>`).join('')
    : '';
  return `<tr class="detail"><td></td><td colspan="3">
    ${c.materialsUrl ? `<a href="${esc(c.materialsUrl)}" target="_blank" rel="noopener">Open course materials in Schoology →</a>` : ''}
    <div style="margin-top:8px">${docs}</div>${weak}</td></tr>`;
}
function renderTable() {
  const rows = filtered();
  if (!rows.length) { $('#view').innerHTML = '<div class="empty">No courses match these filters.</div>'; return; }
  $('#view').innerHTML = '<div class="tablewrap"><table><thead><tr>' +
    '<th style="width:70px">Code</th><th style="width:34%">Course</th>' +
    '<th style="width:120px">Scale posted</th><th>Evidence</th>' +
    '</tr></thead><tbody>' + rows.map(c => {
      const isOpen = open.has(c.row);
      return `<tr class="course${isOpen ? ' open' : ''}" data-row="${c.row}">
        <td class="code">${esc(c.code)}</td>
        <td><span class="caret">▶</span> ${esc(c.name)}<div class="why" style="padding-left:16px">${esc(c.dept)}</div></td>
        <td><span class="pill ${c.status}">${esc(LABEL[c.status])}</span>${c.reviewed ? '<span class="tag">checked</span>' : ''}</td>
        <td>${c.count ? `<b>${c.count}</b> document${c.count === 1 ? '' : 's'}` : '—'}
            <div class="why">${esc(c.reason)}</div></td></tr>` + (isOpen ? detailHtml(c) : '');
    }).join('') + '</tbody></table></div>';
  for (const tr of document.querySelectorAll('tr.course')) {
    tr.onclick = (e) => {
      if (e.target.closest('a')) return;
      const k = Number(tr.dataset.row);
      open.has(k) ? open.delete(k) : open.add(k);
      renderTable();
    };
  }
}
renderStats(); renderDepts(DATA.courses); renderTable();
for (const s of ['#q', '#dept', '#status']) {
  $(s).oninput = renderTable; $(s).onchange = renderTable;
}
