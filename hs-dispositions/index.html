<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nido Skills & Dispositions</title>
    <link rel="stylesheet" href="style.css">
    <!-- D3 library for visualizations later -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        /* A few extra styles to complement style.css */
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 900px;
            margin: 2rem auto;
            background: var(--nido-white);
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-label {
            display: block;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }
        .form-control {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: var(--font-gotham);
            font-size: 1rem;
        }
        .disp-card {
            border: 2px solid #eaeaea;
            border-radius: 8px;
            padding: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .disp-card:hover {
            border-color: var(--nido-blue);
            background-color: #f9fbff;
        }
        .disp-card input[type="checkbox"] {
            transform: scale(1.5);
            cursor: pointer;
        }
        /* Custom Tooltip */
        #d3-tooltip {
            position: absolute;
            text-align: center;
            padding: 8px;
            font-size: 14px;
            background: rgba(0, 35, 101, 0.9); /* Nido Blue */
            color: #fff;
            border-radius: 4px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="d3-tooltip"></div>
    
    <!-- Header -->
    <header class="bg-nido-blue text-white" style="padding: 1.5rem 2rem;">
        <h1 class="font-bold" style="margin: 0;">Nido Skills & Dispositions Selector</h1>
    </header>

    <main class="container">
        <!-- Google Sign-In Placeholder -->
        <div id="auth-section" style="text-align: right; margin-bottom: 1rem;">
            <p class="text-nido-dark font-medium">Not signed in <button class="btn-nido-blue" style="margin-left: 1rem;">Sign in with Google</button></p>
            <hr style="border: 0; border-top: 1px solid #eee; margin: 1rem 0;">
        </div>

        <section id="selection-form">
            <h2 class="text-nido-red font-medium" style="margin-top: 0;">1. Select Context</h2>
            <div style="display: flex; gap: 1.5rem; margin-top: 1rem; flex-wrap: wrap;">
                <div class="form-group" style="flex: 1; min-width: 250px;">
                    <label for="department-select" class="form-label text-nido-blue">Department:</label>
                    <select id="department-select" class="form-control">
                        <option value="">-- Select a Department --</option>
                    </select>
                </div>
                <div class="form-group" style="flex: 1; min-width: 250px;">
                    <label for="course-select" class="form-label text-nido-blue">Course (Optional):</label>
                    <select id="course-select" class="form-control" disabled>
                        <option value="">-- Select a Course --</option>
                    </select>
                </div>
            </div>

            <h2 class="text-nido-red font-medium" style="margin-top: 2rem;">2. Select Dispositions</h2>
            <p class="text-nido-dark">Select the core dispositions you are focusing on for this course/department.</p>
            
            <div id="dispositions-container" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem; margin-top: 1rem;">
                <!-- Disposition checkboxes generated via JS -->
            </div>

            <button id="save-btn" class="btn-nido-blue" style="margin-top: 2rem; font-size: 1.2rem; width: 100%; padding: 1rem;">Save Selections</button>
        </section>
    </main>

    <!-- Visualization Section -->
    <div class="container" style="margin-top: 2rem; margin-bottom: 4rem;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
            <h2 class="text-nido-blue font-bold" style="margin: 0;">Visualization Preview</h2>
            <div>
                <label for="group-by-select" class="font-bold text-nido-dark" style="margin-right: 0.5rem;">Group By:</label>
                <select id="group-by-select" style="padding: 0.5rem; border-radius: 4px; border: 1px solid #ccc;">
                    <option value="disposition">Disposition</option>
                    <option value="department">Department</option>
                </select>
            </div>
        </div>
        <div id="d3-container" style="width: 100%; height: 500px; background: #fafafa; border: 1px dashed #ccc; border-radius: 8px; display: flex; align-items: center; justify-content: center; position: relative;">
            <!-- SVG will go here -->
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
