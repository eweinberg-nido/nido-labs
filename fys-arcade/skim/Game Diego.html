<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Football 1v1 - v1</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      padding: 10px;
    }

    .game-container {
      position: relative;
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Scoreboard Styling */
    .scoreboard {
      width: 100%;
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
      border: 2px solid #334155;
      border-radius: 12px;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .team-score {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 28px;
      font-weight: 800;
    }

    .team-badge {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 10px currentColor;
    }

    .red-badge { background-color: #ef4444; color: #ef4444; }
    .blue-badge { background-color: #3b82f6; color: #3b82f6; }

    .score-num {
      background: #020617;
      padding: 4px 16px;
      border-radius: 8px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 36px;
      border: 1px solid #1e293b;
    }

    .timer-container {
      text-align: center;
    }

    .timer-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #94a3b8;
      margin-bottom: 2px;
    }

    .timer {
      font-size: 24px;
      font-weight: 700;
      font-family: 'Courier New', Courier, monospace;
      color: #f59e0b;
      background: #020617;
      padding: 4px 12px;
      border-radius: 6px;
      border: 1px solid #1e293b;
    }

    /* Canvas Area */
    .canvas-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: #15803d;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.6), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      border: 4px solid #334155;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Overlay Message */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
      z-index: 10;
      transition: opacity 0.3s ease;
    }

    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .overlay-title {
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 2px;
      text-shadow: 0 4px 12px rgba(0,0,0,0.5);
      text-align: center;
    }

    .overlay-subtitle {
      font-size: 18px;
      color: #cbd5e1;
      text-align: center;
      max-width: 80%;
    }

    .btn {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: white;
      border: none;
      padding: 12px 32px;
      font-size: 18px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
      transition: all 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.6);
    }

    /* Control Bar */
    .controls-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      gap: 10px;
    }

    .mode-toggle {
      display: flex;
      background: #1e293b;
      padding: 4px;
      border-radius: 8px;
      border: 1px solid #334155;
    }

    .mode-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .mode-btn.active {
      background: #3b82f6;
      color: white;
    }

    .controls-hint {
      font-size: 12px;
      color: #94a3b8;
      display: flex;
      gap: 16px;
    }

    .key-badge {
      background: #334155;
      color: #f8fafc;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
      font-family: monospace;
    }

    /* On-Screen Mobile Touch Controls */
    .touch-controls {
      display: none;
      width: 100%;
      margin-top: 12px;
      justify-content: space-between;
      touch-action: none;
    }

    @media (max-width: 768px) {
      .touch-controls {
        display: flex;
      }
      .controls-hint {
        display: none;
      }
      .overlay-title { font-size: 30px; }
      .score-num { font-size: 28px; }
    }

    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 48px);
      grid-template-rows: repeat(3, 48px);
      gap: 4px;
    }

    .dbtn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      color: white;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }

    .dbtn:active {
      background: rgba(255, 255, 255, 0.3);
    }

    .action-btn {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: radial-gradient(circle, #ef4444 0%, #dc2626 100%);
      border: 3px solid #f8fafc;
      color: white;
      font-weight: 800;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.5);
    }
  </style>
</head>
<body>

  <div class="game-container">
    <!-- Scoreboard -->
    <div class="scoreboard">
      <div class="team-score">
        <span class="team-badge red-badge"></span>
        <span style="color: #f8fafc;">RED</span>
        <span class="score-num" id="score-red">0</span>
      </div>

      <div class="timer-container">
        <div class="timer-label">TIME</div>
        <div class="timer" id="match-timer">02:00</div>
      </div>

      <div class="team-score">
        <span class="score-num" id="score-blue">0</span>
        <span style="color: #f8fafc;">BLUE</span>
        <span class="team-badge blue-badge"></span>
      </div>
    </div>

    <!-- Pitch Canvas -->
    <div class="canvas-wrapper">
      <canvas id="pitchCanvas" width="900" height="506"></canvas>

      <!-- Game Overlay Screen -->
      <div class="overlay" id="gameOverlay">
        <div class="overlay-title" id="overlayTitle">FOOTBALL 1v1</div>
        <div class="overlay-subtitle" id="overlaySub">Red vs Blue — First to score wins or highest score when time expires!</div>
        <button class="btn" id="startBtn">PLAY GAME</button>
      </div>
    </div>

    <!-- Mode Selector & Control Hints -->
    <div class="controls-bar">
      <div class="mode-toggle">
        <button class="mode-btn active" id="mode1p">1 Player (vs AI)</button>
        <button class="mode-btn" id="mode2p">2 Players</button>
      </div>

      <div class="controls-hint">
        <div><span style="color:#ef4444; font-weight:bold;">RED:</span> <span class="key-badge">W A S D</span> Move | <span class="key-badge">SPACE</span> Kick</div>
        <div id="blueHint"><span style="color:#3b82f6; font-weight:bold;">BLUE:</span> <span class="key-badge">ARROWS</span> Move | <span class="key-badge">ENTER</span> Kick</div>
      </div>
    </div>

    <!-- Mobile Touch Controls -->
    <div class="touch-controls">
      <div class="dpad">
        <div></div>
        <div class="dbtn" id="btnUp">▲</div>
        <div></div>
        <div class="dbtn" id="btnLeft">◄</div>
        <div></div>
        <div class="dbtn" id="btnRight">►</div>
        <div></div>
        <div class="dbtn" id="btnDown">▼</div>
        <div></div>
      </div>
      <div style="display: flex; align-items: center;">
        <div class="action-btn" id="btnKick">KICK</div>
      </div>
    </div>
  </div>

  <script>
    // --- CANVAS & SYSTEM SETUP ---
    const canvas = document.getElementById('pitchCanvas');
    const ctx = canvas.getContext('2d');

    // UI Elements
    const scoreRedEl = document.getElementById('score-red');
    scoreBlueEl = document.getElementById('score-blue');
    const timerEl = document.getElementById('match-timer');
    const overlay = document.getElementById('gameOverlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlaySub = document.getElementById('overlaySub');
    const startBtn = document.getElementById('startBtn');
    const mode1pBtn = document.getElementById('mode1p');
    const mode2pBtn = document.getElementById('mode2p');
    const blueHint = document.getElementById('blueHint');

    // Field Dimensions & Constants
    const CANVAS_WIDTH = 900;
    const CANVAS_HEIGHT = 506;
    const PITCH_MARGIN = 40;
    const GOAL_HEIGHT = 140;
    const GOAL_DEPTH = 30;

    // Game Logic Variables
    let isAiMode = true;
    let gameState = 'START'; // START, PLAYING, GOAL_SCORED, GAME_OVER
    let matchTime = 120; // 2 minutes in seconds
    let matchTimerInterval = null;
    let goalBannerTimer = 0;
    let winningTeam = '';

    let scores = { red: 0, blue: 0 };

    // Keyboard Inputs state
    const keys = {};

    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if(['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
        e.preventDefault(); // Prevent page scrolling
      }
    });

    window.addEventListener('keyup', (e) => {
      keys[e.code] = false;
    });

    // Touch control triggers
    const touchKeys = { up: false, down: false, left: false, right: false, kick: false };
    
    function bindTouchButton(id, keyProp) {
      const el = document.getElementById(id);
      if(!el) return;
      el.addEventListener('touchstart', (e) => { e.preventDefault(); touchKeys[keyProp] = true; });
      el.addEventListener('touchend', (e) => { e.preventDefault(); touchKeys[keyProp] = false; });
      el.addEventListener('mousedown', (e) => { touchKeys[keyProp] = true; });
      el.addEventListener('mouseup', (e) => { touchKeys[keyProp] = false; });
    }

    bindTouchButton('btnUp', 'up');
    bindTouchButton('btnDown', 'down');
    bindTouchButton('btnLeft', 'left');
    bindTouchButton('btnRight', 'right');
    bindTouchButton('btnKick', 'kick');

    // Mode Toggle Logic
    mode1pBtn.addEventListener('click', () => {
      isAiMode = true;
      mode1pBtn.classList.add('active');
      mode2pBtn.classList.remove('active');
      blueHint.style.opacity = '0.5';
    });

    mode2pBtn.addEventListener('click', () => {
      isAiMode = false;
      mode2pBtn.classList.add('active');
      mode1pBtn.classList.remove('active');
      blueHint.style.opacity = '1';
    });

    // --- GAME ENTITIES ---

    class Player {
      constructor(x, y, color, team) {
        this.startX = x;
        this.startY = y;
        this.x = x;
        this.y = y;
        this.radius = 18;
        this.color = color;
        this.team = team; // 'red' or 'blue'
        this.vx = 0;
        this.vy = 0;
        this.speed = 4.2;
        this.friction = 0.88;
        this.kickPower = 11;
        this.isKicking = false;
        this.kickCooldown = 0;
      }

      reset() {
        this.x = this.startX;
        this.y = this.startY;
        this.vx = 0;
        this.vy = 0;
      }

      update() {
        // Apply friction
        this.vx *= this.friction;
        this.vy *= this.friction;

        // Position update
        this.x += this.vx;
        this.y += this.vy;

        // Pitch Boundary Collisions (Keep inside bounds, allow inside goal area)
        const minX = PITCH_MARGIN + this.radius;
        const maxX = CANVAS_WIDTH - PITCH_MARGIN - this.radius;
        const minY = PITCH_MARGIN + this.radius;
        const maxY = CANVAS_HEIGHT - PITCH_MARGIN - this.radius;

        if (this.x < minX) this.x = minX;
        if (this.x > maxX) this.x = maxX;
        if (this.y < minY) this.y = minY;
        if (this.y > maxY) this.y = maxY;

        if (this.kickCooldown > 0) this.kickCooldown--;
      }

      draw() {
        ctx.save();

        // Player Shadow
        ctx.beginPath();
        ctx.ellipse(this.x, this.y + this.radius * 0.7, this.radius, this.radius * 0.5, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
        ctx.fill();

        // Kick Ring Indicator
        if (this.isKicking) {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius + 6, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
          ctx.lineWidth = 3;
          ctx.stroke();
        }

        // Main Player Body
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();

        // Inner Team Icon / Marker
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius * 0.4, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();

        ctx.restore();
      }
    }

    class Ball {
      constructor(x, y) {
        this.startX = x;
        this.startY = y;
        this.x = x;
        this.y = y;
        this.radius = 10;
        this.vx = 0;
        this.vy = 0;
        this.friction = 0.982; // Rolling resistance
        this.rotation = 0;
      }

      reset() {
        this.x = this.startX;
        this.y = this.startY;
        this.vx = 0;
        this.vy = 0;
      }

      update() {
        this.vx *= this.friction;
        this.vy *= this.friction;

        this.x += this.vx;
        this.y += this.vy;

        this.rotation += Math.sqrt(this.vx * this.vx + this.vy * this.vy) * 0.1;

        const goalTop = (CANVAS_HEIGHT - GOAL_HEIGHT) / 2;
        const goalBottom = goalTop + GOAL_HEIGHT;

        // Goal Post Collisions / Bounces
        const minX = PITCH_MARGIN + this.radius;
        const maxX = CANVAS_WIDTH - PITCH_MARGIN - this.radius;
        const minY = PITCH_MARGIN + this.radius;
        const maxY = CANVAS_HEIGHT - PITCH_MARGIN - this.radius;

        // Top and Bottom pitch walls
        if (this.y < minY) {
          this.y = minY;
          this.vy *= -0.7;
        }
        if (this.y > maxY) {
          this.y = maxY;
          this.vy *= -0.7;
        }

        // Left wall (Goal check vs Bounce)
        if (this.x < minX) {
          if (this.y > goalTop + this.radius && this.y < goalBottom - this.radius) {
            // Inside Left Goal (Blue Scores!)
            if (this.x < PITCH_MARGIN - GOAL_DEPTH + this.radius) {
              handleGoal('blue');
            }
          } else {
            this.x = minX;
            this.vx *= -0.7;
          }
        }

        // Right wall (Goal check vs Bounce)
        if (this.x > maxX) {
          if (this.y > goalTop + this.radius && this.y < goalBottom - this.radius) {
            // Inside Right Goal (Red Scores!)
            if (this.x > CANVAS_WIDTH - PITCH_MARGIN + GOAL_DEPTH - this.radius) {
              handleGoal('red');
            }
          } else {
            this.x = maxX;
            this.vx *= -0.7;
          }
        }
      }

      draw() {
        ctx.save();

        // Ball Shadow
        ctx.beginPath();
        ctx.ellipse(this.x, this.y + 6, this.radius, this.radius * 0.5, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
        ctx.fill();

        // Ball Body
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);

        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = '#0f172a';
        ctx.stroke();

        // Soccer Ball Pattern Details
        ctx.beginPath();
        ctx.arc(0, 0, this.radius * 0.4, 0, Math.PI * 2);
        ctx.fillStyle = '#0f172a';
        ctx.fill();

        for (let i = 0; i < 3; i++) {
          ctx.beginPath();
          ctx.moveTo(0, 0);
          const angle = (i * 120 * Math.PI) / 180;
          ctx.lineTo(Math.cos(angle) * this.radius, Math.sin(angle) * this.radius);
          ctx.strokeStyle = '#0f172a';
          ctx.stroke();
        }

        ctx.restore();
      }
    }

    // Spawn Entities
    const redPlayer = new Player(180, CANVAS_HEIGHT / 2, '#ef4444', 'red');
    const bluePlayer = new Player(CANVAS_WIDTH - 180, CANVAS_HEIGHT / 2, '#3b82f6', 'blue');
    const ball = new Ball(CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2);

    // Particles for Goal Celebration
    let particles = [];
    function triggerGoalParticles(x, y, color) {
      particles = [];
      for (let i = 0; i < 60; i++) {
        particles.push({
          x: x,
          y: y,
          vx: (Math.random() - 0.5) * 12,
          vy: (Math.random() - 0.5) * 12,
          size: Math.random() * 6 + 4,
          color: color,
          life: 1
        });
      }
    }

    function updateAndDrawParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.02;

        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    // --- PHYSICS & COLLISIONS ---

    function handleCollisions() {
      // 1. Player vs Ball
      collidePlayerBall(redPlayer);
      collidePlayerBall(bluePlayer);

      // 2. Player vs Player
      const dx = bluePlayer.x - redPlayer.x;
      const dy = bluePlayer.y - redPlayer.y;
      const dist = Math.hypot(dx, dy);
      const minDist = redPlayer.radius + bluePlayer.radius;

      if (dist < minDist) {
        const overlap = minDist - dist;
        const nx = dx / (dist || 1);
        const ny = dy / (dist || 1);

        redPlayer.x -= nx * overlap * 0.5;
        redPlayer.y -= ny * overlap * 0.5;
        bluePlayer.x += nx * overlap * 0.5;
        bluePlayer.y += ny * overlap * 0.5;
      }
    }

    function collidePlayerBall(player) {
      const dx = ball.x - player.x;
      const dy = ball.y - player.y;
      const dist = Math.hypot(dx, dy);
      const minDist = player.radius + ball.radius;

      if (dist < minDist) {
        const nx = dx / (dist || 1);
        const ny = dy / (dist || 1);
        const overlap = minDist - dist;

        // Push ball out of player body
        ball.x += nx * overlap;
        ball.y += ny * overlap;

        // Impulse transfer
        let power = player.isKicking ? player.kickPower : 3.5;
        ball.vx = nx * power + player.vx * 0.5;
        ball.vy = ny * power + player.vy * 0.5;
      }
    }

    // --- CONTROLS & AI ENGINE ---

    function processInputs() {
      // Red Player Controls (WASD / Touch)
      let redMoveX = 0;
      let redMoveY = 0;

      if (keys['KeyW'] || touchKeys.up) redMoveY -= 1;
      if (keys['KeyS'] || touchKeys.down) redMoveY += 1;
      if (keys['KeyA'] || touchKeys.left) redMoveX -= 1;
      if (keys['KeyD'] || touchKeys.right) redMoveX += 1;

      if (redMoveX !== 0 && redMoveY !== 0) {
        redMoveX *= 0.7071;
        redMoveY *= 0.7071;
      }

      redPlayer.vx += redMoveX * redPlayer.speed * 0.25;
      redPlayer.vy += redMoveY * redPlayer.speed * 0.25;

      redPlayer.isKicking = (keys['Space'] || touchKeys.kick) && redPlayer.kickCooldown === 0;
      if (redPlayer.isKicking) redPlayer.kickCooldown = 15;

      // Blue Player Controls (P2 or AI)
      if (!isAiMode) {
        let blueMoveX = 0;
        let blueMoveY = 0;

        if (keys['ArrowUp']) blueMoveY -= 1;
        if (keys['ArrowDown']) blueMoveY += 1;
        if (keys['ArrowLeft']) blueMoveX -= 1;
        if (keys['ArrowRight']) blueMoveX += 1;

        if (blueMoveX !== 0 && blueMoveY !== 0) {
          blueMoveX *= 0.7071;
          blueMoveY *= 0.7071;
        }

        bluePlayer.vx += blueMoveX * bluePlayer.speed * 0.25;
        bluePlayer.vy += blueMoveY * bluePlayer.speed * 0.25;

        bluePlayer.isKicking = keys['Enter'] && bluePlayer.kickCooldown === 0;
        if (bluePlayer.isKicking) bluePlayer.kickCooldown = 15;
      } else {
        updateAiBot();
      }
    }

    function updateAiBot() {
      // Smart Football AI Behavior
      const targetX = ball.x + (ball.vx * 5);
      const targetY = ball.y + (ball.vy * 5);

      let aimX = targetX;
      let aimY = targetY;

      // Defend home goal if ball is far on Red side
      if (ball.x < CANVAS_WIDTH * 0.35) {
        aimX = CANVAS_WIDTH - 200;
        aimY = CANVAS_HEIGHT / 2 + (ball.y - CANVAS_HEIGHT / 2) * 0.5;
      }

      const dx = aimX - bluePlayer.x;
      const dy = aimY - bluePlayer.y;
      const dist = Math.hypot(dx, dy);

      if (dist > 10) {
        bluePlayer.vx += (dx / dist) * bluePlayer.speed * 0.18;
        bluePlayer.vy += (dy / dist) * bluePlayer.speed * 0.18;
      }

      // Auto kick when near ball facing goal
      const distToBall = Math.hypot(ball.x - bluePlayer.x, ball.y - bluePlayer.y);
      if (distToBall < bluePlayer.radius + ball.radius + 12) {
        bluePlayer.isKicking = true;
      } else {
        bluePlayer.isKicking = false;
      }
    }

    // --- GAME FLOW & GOAL SYSTEM ---

    function handleGoal(scoringTeam) {
      if (gameState !== 'PLAYING') return;

      gameState = 'GOAL_SCORED';
      goalBannerTimer = 110; // Frames duration

      if (scoringTeam === 'red') {
        scores.red++;
        scoreRedEl.textContent = scores.red;
        triggerGoalParticles(CANVAS_WIDTH - PITCH_MARGIN, CANVAS_HEIGHT / 2, '#ef4444');
      } else {
        scores.blue++;
        scoreBlueEl.textContent = scores.blue;
        triggerGoalParticles(PITCH_MARGIN, CANVAS_HEIGHT / 2, '#3b82f6');
      }
    }

    function resetPositions() {
      redPlayer.reset();
      bluePlayer.reset();
      ball.reset();
    }

    function startTimer() {
      clearInterval(matchTimerInterval);
      matchTimerInterval = setInterval(() => {
        if (gameState === 'PLAYING') {
          matchTime--;
          updateTimerDisplay();

          if (matchTime <= 0) {
            endGame();
          }
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      const mins = Math.floor(matchTime / 60).toString().padStart(2, '0');
      const secs = (matchTime % 60).toString().padStart(2, '0');
      timerEl.textContent = `${mins}:${secs}`;
    }

    function resetGame() {
      scores = { red: 0, blue: 0 };
      scoreRedEl.textContent = '0';
      scoreBlueEl.textContent = '0';
      matchTime = 120;
      updateTimerDisplay();
      resetPositions();
    }

    function startGame() {
      resetGame();
      gameState = 'PLAYING';
      overlay.classList.add('hidden');
      startTimer();
    }

    function endGame() {
      gameState = 'GAME_OVER';
      clearInterval(matchTimerInterval);

      if (scores.red > scores.blue) {
        winningTeam = 'RED WINS!';
        overlayTitle.style.color = '#ef4444';
      } else if (scores.blue > scores.red) {
        winningTeam = 'BLUE WINS!';
        overlayTitle.style.color = '#3b82f6';
      } else {
        winningTeam = 'DRAW GAME!';
        overlayTitle.style.color = '#f8fafc';
      }

      overlayTitle.textContent = winningTeam;
      overlaySub.textContent = `Final Score: Red ${scores.red} - ${scores.blue} Blue`;
      startBtn.textContent = 'REPLAY MATCH';
      overlay.classList.remove('hidden');
    }

    startBtn.addEventListener('click', startGame);

    // --- DRAWING THE FOOTBALL PITCH ---

    function drawPitch() {
      // Grass Gradient Background
      ctx.fillStyle = '#15803d';
      ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

      // Alternating Striped Grass
      const stripeWidth = (CANVAS_WIDTH - PITCH_MARGIN * 2) / 10;
      for (let i = 0; i < 10; i++) {
        if (i % 2 === 0) {
          ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
          ctx.fillRect(PITCH_MARGIN + i * stripeWidth, PITCH_MARGIN, stripeWidth, CANVAS_HEIGHT - PITCH_MARGIN * 2);
        }
      }

      // White Field Lines Configuration
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 3;

      // Outer Pitch Boundary
      ctx.strokeRect(PITCH_MARGIN, PITCH_MARGIN, CANVAS_WIDTH - PITCH_MARGIN * 2, CANVAS_HEIGHT - PITCH_MARGIN * 2);

      // Halfway Line
      ctx.beginPath();
      ctx.moveTo(CANVAS_WIDTH / 2, PITCH_MARGIN);
      ctx.lineTo(CANVAS_WIDTH / 2, CANVAS_HEIGHT - PITCH_MARGIN);
      ctx.stroke();

      // Center Circle & Spot
      ctx.beginPath();
      ctx.arc(CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2, 60, 0, Math.PI * 2);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2, 4, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();

      // Penalty Areas
      const goalTop = (CANVAS_HEIGHT - GOAL_HEIGHT) / 2;

      // Left Penalty Box
      ctx.strokeRect(PITCH_MARGIN, goalTop - 25, 110, GOAL_HEIGHT + 50);
      // Right Penalty Box
      ctx.strokeRect(CANVAS_WIDTH - PITCH_MARGIN - 110, goalTop - 25, 110, GOAL_HEIGHT + 50);

      // Goal Structures (Nets & Posts)
      // Left Goal Net
      ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
      ctx.fillRect(PITCH_MARGIN - GOAL_DEPTH, goalTop, GOAL_DEPTH, GOAL_HEIGHT);
      ctx.strokeRect(PITCH_MARGIN - GOAL_DEPTH, goalTop, GOAL_DEPTH, GOAL_HEIGHT);

      // Right Goal Net
      ctx.fillRect(CANVAS_WIDTH - PITCH_MARGIN, goalTop, GOAL_DEPTH, GOAL_HEIGHT);
      ctx.strokeRect(CANVAS_WIDTH - PITCH_MARGIN, goalTop, GOAL_DEPTH, GOAL_HEIGHT);

      // Goal Post Highlight Caps
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(PITCH_MARGIN - 4, goalTop - 4, 8, 8);
      ctx.fillRect(PITCH_MARGIN - 4, goalTop + GOAL_HEIGHT - 4, 8, 8);
      ctx.fillRect(CANVAS_WIDTH - PITCH_MARGIN - 4, goalTop - 4, 8, 8);
      ctx.fillRect(CANVAS_WIDTH - PITCH_MARGIN - 4, goalTop + GOAL_HEIGHT - 4, 8, 8);
    }

    function renderGoalBanner() {
      ctx.save();
      ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
      ctx.fillRect(0, CANVAS_HEIGHT / 2 - 50, CANVAS_WIDTH, 100);

      ctx.font = '900 48px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#f59e0b';
      ctx.shadowColor = 'rgba(0,0,0,0.8)';
      ctx.shadowBlur = 10;
      ctx.fillText('GOAL!', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2);
      ctx.restore();
    }

    // --- MAIN GAME LOOP ---

    function gameLoop() {
      // 1. Logic Updates
      if (gameState === 'PLAYING') {
        processInputs();
        redPlayer.update();
        bluePlayer.update();
        ball.update();
        handleCollisions();
      } else if (gameState === 'GOAL_SCORED') {
        ball.update();
        goalBannerTimer--;
        if (goalBannerTimer <= 0) {
          resetPositions();
          gameState = 'PLAYING';
        }
      }

      // 2. Rendering
      drawPitch();
      redPlayer.draw();
      bluePlayer.draw();
      ball.draw();
      updateAndDrawParticles();

      if (gameState === 'GOAL_SCORED') {
        renderGoalBanner();
      }

      requestAnimationFrame(gameLoop);
    }

    // Initialize Game Loop
    requestAnimationFrame(gameLoop);

  </script>
</body>
