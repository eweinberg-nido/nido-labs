<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Ten Frames</title>
<style>
  :root {
    --ink: #000;
    --paper: #fff;
    --muted: #9a9a9a;
    --a: #e8452c;   /* first number */
    --b: #1f5fd6;   /* second number */
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--paper); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none; overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  body { display: flex; flex-direction: column; }

  /* ---------- top bar ---------- */
  #bar {
    flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 10px 16px; border-bottom: 4px solid var(--ink);
  }
  .grp { display: flex; gap: 10px; align-items: center; }
  button {
    font: inherit; font-weight: 800; font-size: 22px; color: var(--ink); background: var(--paper);
    border: 4px solid var(--ink); border-radius: 12px; min-width: 56px; height: 56px; padding: 0 14px;
    display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
  }
  button:active { background: var(--ink); color: var(--paper); }
  button.on { background: var(--ink); color: var(--paper); }
  button svg { width: 30px; height: 30px; display: block; }

  /* ---------- stage ---------- */
  #stage {
    flex: 1 1 auto; position: relative; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-end; min-height: 0; padding-bottom: 8px;
  }
  .row { display: flex; align-items: flex-start; }
  .slot { display: flex; flex-direction: column; align-items: center; }
  .frame {
    display: grid; background: var(--ink);
  }
  .cell { background: var(--paper); display: grid; place-items: center; }
  .sep {
    align-self: stretch; display: flex; align-items: flex-start; justify-content: center;
    font-weight: 900; line-height: 1; color: var(--ink);
  }
  .count {
    font-weight: 900; line-height: 1; visibility: hidden; color: var(--ink);
    display: flex; align-items: center; justify-content: center;
  }
  .show .count { visibility: visible; }
  #total { font-weight: 900; line-height: 1; font-size: 64px; display: none; }
  .show #total { display: block; }
  .show #hint { display: none; }

  /* ---------- counters ---------- */
  .dot { border-radius: 50%; cursor: grab; touch-action: none; }
  .dot.a { background: var(--a); }
  .dot.b { background: var(--b); }
  .mono .dot.b { background: var(--a); }
  .dot.lift { opacity: 0; }
  #colors i { display: inline-block; width: 18px; height: 18px; border-radius: 50%; margin: 0 2px; }
  #colors i:first-child { background: var(--a); }
  #colors i:last-child { background: var(--b); }
  .mono #colors i:last-child { background: var(--a); }
  .ghost {
    position: fixed; z-index: 50; pointer-events: none; cursor: grabbing;
    box-shadow: 0 10px 22px rgba(0,0,0,.28); transform: scale(1.08);
  }

  /* ---------- tray ---------- */
  #tray {
    flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between;
    padding: 10px 28px; border-top: 4px solid var(--ink); min-height: 110px;
  }
  .pile { position: relative; width: 150px; height: 88px; cursor: grab; }
  .pile .dot { position: absolute; width: 72px; height: 72px; top: 8px; pointer-events: none; }
  .pile .dot:nth-child(1) { left: 0; }
  .pile .dot:nth-child(2) { left: 36px; }
  .pile .dot:nth-child(3) { left: 72px; }
  #hint {
    color: var(--muted); font-size: 18px; font-weight: 600; text-align: center;
    display: flex; gap: 28px; align-items: center;
  }
  #hint span { display: inline-flex; align-items: center; gap: 8px; }
  #hint i { display: inline-block; width: 18px; height: 18px; border-radius: 50%; background: var(--muted); }
  #hint b { display: inline-block; width: 22px; height: 22px; border: 3px solid var(--muted); }

  @media (max-width: 760px) {
    #hint { display: none; }
    button { min-width: 48px; height: 48px; padding: 0 8px; }
    .pile { width: 110px; }
    .pile .dot { width: 56px; height: 56px; }
    .pile .dot:nth-child(2) { left: 26px; } .pile .dot:nth-child(3) { left: 52px; }
  }
</style>
</head>
<body>

<div id="bar">
  <div class="grp">
    <button id="less" title="Remove a frame" aria-label="Remove a frame">
      <svg viewBox="0 0 40 30"><rect x="3" y="7" width="22" height="16" fill="none" stroke="currentColor" stroke-width="3"/><line x1="14" y1="7" x2="14" y2="23" stroke="currentColor" stroke-width="2"/><line x1="3" y1="15" x2="25" y2="15" stroke="currentColor" stroke-width="2"/><line x1="29" y1="15" x2="39" y2="15" stroke="currentColor" stroke-width="4"/></svg>
    </button>
    <button id="more" title="Add a frame" aria-label="Add a frame">
      <svg viewBox="0 0 40 30"><rect x="3" y="7" width="22" height="16" fill="none" stroke="currentColor" stroke-width="3"/><line x1="14" y1="7" x2="14" y2="23" stroke="currentColor" stroke-width="2"/><line x1="3" y1="15" x2="25" y2="15" stroke="currentColor" stroke-width="2"/><line x1="29" y1="15" x2="39" y2="15" stroke="currentColor" stroke-width="4"/><line x1="34" y1="10" x2="34" y2="20" stroke="currentColor" stroke-width="4"/></svg>
    </button>
  </div>
  <div class="grp">
    <button id="colors" title="One color / two colors" aria-label="Switch between one and two colors"><i></i><i></i></button>
    <button id="nums"title="Show / hide numbers" aria-label="Show or hide numbers">123</button>
    <button id="undo" title="Undo" aria-label="Undo">
      <svg viewBox="0 0 30 30"><path d="M9 7 L3 13 L9 19" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 13 H18 a8 8 0 0 1 0 16 H12" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/></svg>
    </button>
    <button id="clear" title="Empty the frames" aria-label="Empty the frames">
      <svg viewBox="0 0 30 30"><rect x="3" y="8" width="24" height="15" fill="none" stroke="currentColor" stroke-width="3"/><line x1="7" y1="4" x2="23" y2="27" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/></svg>
    </button>
    <button id="full" title="Full screen" aria-label="Full screen">
      <svg viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"><path d="M3 10V3h7M20 3h7v7M27 20v7h-7M10 27H3v-7"/></svg>
    </button>
  </div>
</div>

<div id="stage"></div>

<div id="tray">
  <div class="pile" data-c="a" aria-label="Red counters"><div class="dot a"></div><div class="dot a"></div><div class="dot a"></div></div>
  <div id="hint">
    <span><i></i> → <b></b></span>
    <span><b></b><i></i> → ✕ &nbsp;drag out to remove</span>
  </div>
  <div id="total"></div>
  <div class="pile" data-c="b" aria-label="Blue counters"><div class="dot b"></div><div class="dot b"></div><div class="dot b"></div></div>
</div>

<script>
(() => {
  const KEY = 'tenframes.v1';
  const stage = document.getElementById('stage');

  // ---------- state ----------
  let S = load() || { frames: [], show: false, nid: 1 };
  const hist = [];
  let cellPx = 100;
  const dragging = new Set();   // ids currently lifted

  function load() {
    try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.frames)) return s; } catch (e) {}
    return null;
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
  function remember() {
    hist.push(JSON.stringify(S.frames));
    if (hist.length > 80) hist.shift();
  }
  const blank = () => Array(10).fill(null);
  function findId(id) {
    for (let f = 0; f < S.frames.length; f++) {
      const i = S.frames[f].cells.findIndex(x => x && x.id === id);
      if (i >= 0) return { f, i };
    }
    return null;
  }
  if (!S.frames.length) S.frames = [{ cells: blank() }, { cells: blank() }];

  // ---------- layout ----------
  // frames stand upright: 2 squares across, 5 down
  const LW = 0.085, SEP = 0.9, LAB = 0.75, VG = 0.35;
  function layout() {
    const W = stage.clientWidth - 24, H = stage.clientHeight - 16, n = S.frames.length;
    let best = { c: 0, per: n };
    // always one row, side by side, so every frame stays within reach
    for (let r = 1; r <= 1; r++) {
      const per = Math.ceil(n / r), rows = Math.ceil(n / per);
      // rows after the first may start with a "+", so leave room for one extra gap
      const cw = W / (per * (2 + 3 * LW) + (per - 1 + (rows > 1 ? 1 : 0)) * SEP);
      const ch = H / (rows * (5 + 6 * LW + LAB) + (rows - 1) * VG);
      const c = Math.min(cw, ch, 170);
      if (c > best.c + 0.5) best = { c, per };
    }
    return best;
  }

  function render(prev, popNew) {
    const { c: raw, per } = layout();
    const c = Math.max(24, Math.floor(raw));
    const L = Math.max(5, Math.round(c * LW));
    cellPx = c;
    stage.innerHTML = '';
    document.body.classList.toggle('show', S.show);
    document.body.classList.toggle('mono', S.mono !== false);
    document.getElementById('nums').classList.toggle('on', S.show);
    let row;
    S.frames.forEach((fr, f) => {
      if (f % per === 0) {
        row = document.createElement('div'); row.className = 'row';
        if (f) row.style.marginTop = Math.round(c * VG) + 'px';
        stage.appendChild(row);
      } else {
        const sep = document.createElement('div');
        sep.className = 'sep';
        sep.style.width = Math.round(c * SEP) + 'px';
        row.appendChild(sep);
      }
      const slot = document.createElement('div'); slot.className = 'slot';
      const el = document.createElement('div'); el.className = 'frame'; el.dataset.f = f;
      // fill order: left column top to bottom, then right column
      el.style.gridTemplateColumns = `repeat(2, ${c}px)`;
      el.style.gridTemplateRows = `repeat(5, ${c}px)`;
      el.style.gridAutoFlow = 'column';
      el.style.gap = el.style.padding = L + 'px';
      fr.cells.forEach((x, i) => {
        const cell = document.createElement('div'); cell.className = 'cell';
        cell.dataset.f = f; cell.dataset.i = i;
        if (x) cell.appendChild(makeDot(x));
        el.appendChild(cell);
      });
      const cnt = document.createElement('div'); cnt.className = 'count';
      cnt.style.height = Math.round(c * LAB) + 'px';
      cnt.style.fontSize = Math.round(c * 0.5) + 'px';
      cnt.textContent = fr.cells.filter(Boolean).length;
      slot.append(el, cnt); row.appendChild(slot);
    });
    document.getElementById('total').textContent =
      S.frames.reduce((s, fr) => s + fr.cells.filter(Boolean).length, 0);
    save();
    if (prev) flip(prev, popNew);
  }

  function makeDot(x) {
    const d = document.createElement('div');
    d.className = 'dot ' + x.c; d.dataset.id = x.id;
    const s = Math.round(cellPx * 0.78) + 'px';
    d.style.width = d.style.height = s;
    if (dragging.has(x.id)) d.classList.add('lift');
    return d;
  }

  // ---------- smooth motion (FLIP) ----------
  function snap() {
    const m = {};
    stage.querySelectorAll('.dot[data-id]').forEach(e => m[e.dataset.id] = e.getBoundingClientRect());
    return m;
  }
  function flip(prev, popNew) {
    let k = 0;
    stage.querySelectorAll('.dot[data-id]').forEach(e => {
      const p = prev[e.dataset.id], r = e.getBoundingClientRect();
      if (p) {
        const dx = p.left + p.width / 2 - (r.left + r.width / 2);
        const dy = p.top + p.height / 2 - (r.top + r.height / 2);
        const s = p.width / r.width;
        if (Math.abs(dx) + Math.abs(dy) > 1 || Math.abs(s - 1) > .01)
          e.animate([{ transform: `translate(${dx}px,${dy}px) scale(${s})` }, { transform: 'none' }],
                    { duration: 280, easing: 'cubic-bezier(.2,.8,.2,1)' });
      } else if (popNew) {
        e.animate([{ transform: 'scale(0)' }, { transform: 'scale(1.12)' }, { transform: 'none' }],
                  { duration: 260, delay: (k++) * 28, easing: 'ease-out', fill: 'backwards' });
      }
    });
  }
  function change(fn, popNew) {
    const prev = snap(); remember(); fn(); render(prev, popNew);
  }

  // ---------- toolbar ----------
  document.getElementById('more').onclick = () => {
    if (S.frames.length >= 8) return;
    change(() => S.frames.push({ cells: blank() }));
  };
  document.getElementById('less').onclick = () => {
    if (S.frames.length <= 1) return;
    change(() => S.frames.pop());
  };
  document.getElementById('clear').onclick = () => change(() => S.frames.forEach(f => f.cells = blank()));
  document.getElementById('undo').onclick = undo;
  document.getElementById('colors').onclick = () => { S.mono = S.mono === false; render(); };
  document.getElementById('nums').onclick =() => { S.show = !S.show; render(); };
  document.getElementById('full').onclick = () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(() => {});
  };
  function undo() {
    if (!hist.length) return;
    const prev = snap();
    S.frames = JSON.parse(hist.pop());
    render(prev, true);
  }
  document.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
  });
  let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => render(), 60); });

  // ---------- dragging (multi-touch friendly) ----------
  const drags = new Map();

  document.addEventListener('pointerdown', e => {
    if (e.button > 0) return;
    const dot = e.target.closest('#stage .dot[data-id]');
    const pile = e.target.closest('.pile');
    if (!dot && !pile) return;
    e.preventDefault();
    const size = Math.round(cellPx * 0.78);
    let id, c, x0, y0;
    if (dot) {
      id = +dot.dataset.id; c = S.frames.flatMap(f => f.cells).find(x => x && x.id === id).c;
      const r = dot.getBoundingClientRect(); x0 = r.left; y0 = r.top;
      dot.classList.add('lift'); dragging.add(id);
    } else {
      c = pile.dataset.c; id = null;
      x0 = e.clientX - size / 2; y0 = e.clientY - size / 2;
    }
    const g = document.createElement('div');
    g.className = 'dot ghost ' + c;
    g.style.width = g.style.height = size + 'px';
    g.style.left = x0 + 'px'; g.style.top = y0 + 'px';
    document.body.appendChild(g);
    drags.set(e.pointerId, { g, id, c, ox: e.clientX - x0, oy: e.clientY - y0, sx: e.clientX, sy: e.clientY, moved: false, pile });
  });

  document.addEventListener('pointermove', e => {
    const d = drags.get(e.pointerId); if (!d) return;
    if (Math.hypot(e.clientX - d.sx, e.clientY - d.sy) > 6) d.moved = true;
    d.g.style.left = (e.clientX - d.ox) + 'px';
    d.g.style.top = (e.clientY - d.oy) + 'px';
  });

  function endDrag(e, cancel) {
    const d = drags.get(e.pointerId); if (!d) return;
    drags.delete(e.pointerId);
    if (d.id != null) dragging.delete(d.id);
    const ghostRect = d.g.getBoundingClientRect();

    // a quick tap on a pile drops one counter into the next empty square
    if (!d.moved && d.pile) {
      d.g.remove();
      const t = nextEmpty(d.c);
      if (t) change(() => S.frames[t.f].cells[t.i] = { id: S.nid++, c: d.c }, true);
      return;
    }
    // a tap on a counter: just put it back
    if (!d.moved || cancel) { d.g.remove(); render(snapWith(d, ghostRect)); return; }

    const from = d.id != null ? findId(d.id) : null;
    let to = targetAt(e.clientX, e.clientY);

    if (!to) {
      // dropped outside the frames: remove it
      if (from) { remember(); S.frames[from.f].cells[from.i] = null; render(); }
      vanish(d.g); return;
    }
    const here = S.frames[to.f].cells[to.i];
    if (here && from && here.id === d.id) { d.g.remove(); render(snapWith(d, ghostRect)); return; }

    if (here && !from) {
      to = nearestEmpty(to.f, e.clientX, e.clientY);
      if (!to) { vanish(d.g); return; }
    }
    const prev = snapWith(d, ghostRect);
    remember();
    if (from) {
      const item = S.frames[from.f].cells[from.i];
      S.frames[from.f].cells[from.i] = S.frames[to.f].cells[to.i] || null; // swap if occupied
      S.frames[to.f].cells[to.i] = item;
    } else {
      const item = { id: S.nid++, c: d.c };
      S.frames[to.f].cells[to.i] = item;
      prev[item.id] = ghostRect;
    }
    d.g.remove();
    render(prev);
  }
  document.addEventListener('pointerup', e => endDrag(e, false));
  document.addEventListener('pointercancel', e => endDrag(e, true));

  function snapWith(d, rect) { const m = snap(); if (d.id != null) m[d.id] = rect; return m; }
  function vanish(g) {
    g.animate([{ transform: 'scale(1.08)', opacity: 1 }, { transform: 'scale(0)', opacity: 0 }],
              { duration: 200, easing: 'ease-in' }).onfinish = () => g.remove();
  }

  function targetAt(x, y) {
    const pad = cellPx * 0.3;
    for (const fr of stage.querySelectorAll('.frame')) {
      const r = fr.getBoundingClientRect();
      if (x < r.left - pad || x > r.right + pad || y < r.top - pad || y > r.bottom + pad) continue;
      let best = null, bd = Infinity;
      fr.querySelectorAll('.cell').forEach(cell => {
        const q = cell.getBoundingClientRect();
        const dd = Math.hypot(x - (q.left + q.width / 2), y - (q.top + q.height / 2));
        if (dd < bd) { bd = dd; best = cell; }
      });
      return { f: +best.dataset.f, i: +best.dataset.i };
    }
    return null;
  }
  function nearestEmpty(f, x, y) {
    let best = null, bd = Infinity;
    stage.querySelectorAll(`.frame[data-f="${f}"] .cell`).forEach(cell => {
      const i = +cell.dataset.i; if (S.frames[f].cells[i]) return;
      const q = cell.getBoundingClientRect();
      const dd = Math.hypot(x - (q.left + q.width / 2), y - (q.top + q.height / 2));
      if (dd < bd) { bd = dd; best = { f, i }; }
    });
    return best;
  }
  function nextEmpty(c) {
    const fs = S.frames;
    for (let f = 0; f < fs.length; f++) {
      const i = fs[f].cells.indexOf(null);
      if (i >= 0) return { f, i };
    }
    return null;
  }

  render(null);
  requestAnimationFrame(() => render(null));
})();
</script>
</body>
</html>
