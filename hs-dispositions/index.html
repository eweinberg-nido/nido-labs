<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nido Skills & Dispositions</title>
    <link rel="stylesheet" href="style.css">
    <!-- D3 library for visualizations later -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        /* A few extra styles to complement style.css */
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 900px;
            margin: 2rem auto;
            background: var(--nido-white);
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-label {
            display: block;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }
        .form-control {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: var(--font-gotham);
            font-size: 1rem;
        }
        .disp-card {
            border: 2px solid #eaeaea;
            border-radius: 8px;
            padding: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .disp-card:hover {
            border-color: var(--nido-blue);
            background-color: #f9fbff;
        }
        .disp-card input[type="checkbox"] {
            transform: scale(1.5);
            cursor: pointer;
        }
        .disp-card input[type="checkbox"]:checked {
            accent-color: var(--nido-blue);
        }
        .lang-es { display: none; }
        body.show-es .lang-en { display: none; }
        body.show-es .lang-es { display: inline; }
        /* Custom Tooltip */
        #d3-tooltip {
            position: absolute;
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 13px;
            pointer-events: none;
            opacity: 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border: 1px solid #ddd;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div id="d3-tooltip"></div>
    
    <!-- Header -->
    <header class="bg-nido-blue text-white" style="padding: 1.5rem 2rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
        <h1 class="font-bold" style="margin: 0;">Nido High School Dispositions Selector</h1>
        <div>
            <select class="lang-select form-control" style="width: auto; font-size: 0.9rem; padding: 0.4rem; color: #333;">
                <option value="en">English</option>
                <option value="es">Español</option>
            </select>
        </div>
    </header>

    <main class="container">
        <!-- Google Sign-In Placeholder -->
        <div id="auth-section" style="text-align: right; margin-bottom: 1rem;">
            <p class="text-nido-dark font-medium">Not signed in <button class="btn-nido-blue" style="margin-left: 1rem;">Sign in with Google</button></p>
            <hr style="border: 0; border-top: 1px solid #eee; margin: 1rem 0;">
        </div>

        <section id="my-courses-section" style="display: none; margin-bottom: 2rem; padding: 1rem; background: #f9f9f9; border-radius: 8px; border: 1px solid #ddd;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2 class="text-nido-blue font-medium" style="margin-top: 0; font-size: 1.2rem;">My Courses</h2>
                <div>
                    <button id="generate-test-data-btn" class="btn-nido-dark" style="display: none; font-size: 0.9rem; padding: 0.5rem 1rem; margin-right: 1rem; background-color: #6c757d; color: white;">Generate Test Data</button>
                    <button id="new-course-btn" class="btn-nido-blue" style="font-size: 0.9rem; padding: 0.5rem 1rem;">+ Start New Course</button>
                </div>
            </div>
            <div id="my-courses-list" style="display: flex; flex-direction: column; gap: 0.5rem; margin-top: 1rem;">
                <!-- User's courses injected here via JS -->
            </div>
        </section>

        <section id="selection-form" style="display: none; padding: 1rem; background: #fff; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 2rem;">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
                <h2 class="text-nido-red font-medium" style="margin-top: 0; margin-bottom: 0;" id="form-title">Course Configuration</h2>
                <div>
                    <label class="text-nido-blue font-bold" style="font-size: 0.9rem; margin-right: 0.5rem;">Signals Language:</label>
                    <select class="lang-select form-control" style="width: auto; font-size: 0.9rem; padding: 0.4rem; display: inline-block;">
                        <option value="en">English</option>
                        <option value="es">Español</option>
                    </select>
                </div>
            </div>
            
            <div style="display: flex; gap: 1.5rem; margin-top: 1.5rem; flex-wrap: wrap;">
                <div class="form-group" style="flex: 1; min-width: 250px;">
                    <label for="department-select" class="form-label text-nido-blue">Department:</label>
                    <select id="department-select" class="form-control">
                        <option value="">-- Select a Department --</option>
                    </select>
                </div>
                <div class="form-group" style="flex: 1; min-width: 250px;">
                    <label for="course-select" class="form-label text-nido-blue">Course Name:</label>
                    <select id="course-select" class="form-control" disabled>
                        <option value="">-- Select a Course --</option>
                    </select>
                </div>
            </div>

            <h3 class="text-nido-red font-medium" style="margin-top: 2rem;">2. Select Dispositions</h3>
            <p class="text-nido-dark" style="margin-bottom: 1.5rem;">Select the core dispositions you are focusing on for this course/department.</p>
            
            <div id="dispositions-container" style="display: flex; flex-wrap: wrap; gap: 1rem;">
                <!-- Disposition checkboxes generated via JS -->
            </div>

            <div style="margin-top: 2rem; display: flex; gap: 1rem;">
                <button class="btn-nido-dark" id="cancel-btn" style="flex: 1; padding: 1rem;">Cancel</button>
                <button class="btn-nido-blue" id="save-btn" style="flex: 1; padding: 1rem;">Save Selections</button>
            </div>
        </section>

        <!-- Visualization Section -->
        <section style="margin-top: 2rem; padding: 1rem; background: #fff; border-radius: 8px; border: 1px solid #ddd;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 1rem;">
                <h2 class="text-nido-blue font-bold" style="margin: 0;">Visualization Preview</h2>
                <div style="display: flex; gap: 1.5rem; align-items: center;">
                    <div>
                        <label for="chart-type-select" class="font-bold text-nido-dark" style="margin-right: 0.5rem; font-size: 0.9rem;">Chart Type:</label>
                        <select id="chart-type-select" class="form-control" style="width: auto; display: inline-block;">
                            <option value="bubble">Bubble Graph</option>
                            <option value="bar">Bar Graph</option>
                        </select>
                    </div>
                    <div>
                        <label for="group-by-select" class="font-bold text-nido-dark" style="margin-right: 0.5rem; font-size: 0.9rem;">Group By:</label>
                        <select id="group-by-select" class="form-control" style="width: auto; display: inline-block;">
                            <option value="disposition">Disposition</option>
                            <option value="department">Department</option>
                        </select>
                    </div>
                </div>
            </div>
            <div id="d3-container" style="width: 100%; height: 500px; border: 1px dashed #ccc; border-radius: 4px; display: flex; align-items: center; justify-content: center; color: #999; position: relative;">
                Waiting for data...
            </div>
        </section>
    </main>

    <script type="module" src="script.js"></script>
</body>
</html>
