<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flappy Unicorn v1</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            background-color: #120b29;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            color: #fff;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 720px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
            border-radius: 16px;
            background: linear-gradient(to bottom, #1d0936, #481259, #822268);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(18, 11, 41, 0.65);
            backdrop-filter: blur(4px);
            z-index: 10;
            transition: opacity 0.3s ease;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 8px;
            text-align: center;
            background: linear-gradient(45deg, #ff9a9e, #fecfef, #a1c4fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 15px rgba(255, 154, 158, 0.4);
            font-weight: 800;
        }

        p.subtitle {
            font-size: 1.1rem;
            color: #d8c2ff;
            margin-bottom: 24px;
            text-align: center;
        }

        .btn {
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            color: white;
            border: none;
            padding: 14px 36px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 117, 140, 0.4);
            transition: all 0.2s ease;
            outline: none;
        }

        .btn:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 8px 25px rgba(255, 117, 140, 0.6);
        }

        .btn:active {
            transform: translateY(1px) scale(0.98);
        }

        .score-board {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 16px 32px;
            margin-bottom: 24px;
            text-align: center;
        }

        .score-board div {
            margin: 6px 0;
            font-size: 1.1rem;
            color: #e2d4ff;
        }

        .score-board span {
            font-weight: bold;
            color: #fff;
            font-size: 1.4rem;
        }

        #score-hud {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 3rem;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 4px 10px rgba(0,0,0,0.3), 0 0 20px rgba(255, 154, 158, 0.6);
            z-index: 5;
            pointer-events: none;
        }

        .version-badge {
            position: absolute;
            bottom: 12px;
            right: 16px;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.4);
            font-weight: bold;
            z-index: 12;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="score-hud">0</div>

        <!-- Start Overlay -->
        <div id="start-overlay" class="overlay">
            <h1>Flappy Unicorn</h1>
            <p class="subtitle">Fly through the magic clouds!</p>
            <button class="btn" id="start-btn">Tap to Play</button>
        </div>

        <!-- Game Over Overlay -->
        <div id="gameover-overlay" class="overlay hidden">
            <h1>Game Over</h1>
            <div class="score-board">
                <div>Score: <span id="final-score">0</span></div>
                <div>Best: <span id="best-score">0</span></div>
            </div>
            <button class="btn" id="restart-btn">Fly Again</button>
        </div>

        <div class="version-badge">v1</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('game-container');
        
        const startOverlay = document.getElementById('start-overlay');
        const gameoverOverlay = document.getElementById('gameover-overlay');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const scoreHud = document.getElementById('score-hud');
        const finalScoreEl = document.getElementById('final-score');
        const bestScoreEl = document.getElementById('best-score');

        // Game State Variables
        let width, height;
        let gameState = 'START'; // START, PLAYING, GAMEOVER
        let score = 0;
        let highScore = 0;
        let frameCount = 0;

        // Physics parameters
        const gravity = 0.38;
        const jumpForce = -7.2;
        const cloudSpeed = 2.2;
        const cloudGap = 170;
        const cloudFrequency = 110;

        // Entities
        let unicorn;
        let clouds = [];
        let particles = [];
        let backgroundStars = [];
        let distantClouds = [];

        function resizeCanvas() {
            width = container.clientWidth;
            height = container.clientHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function initBackground() {
            backgroundStars = [];
            for (let i = 0; i < 40; i++) {
                backgroundStars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 2 + 1,
                    alpha: Math.random() * 0.8 + 0.2,
                    speed: Math.random() * 0.02 + 0.01
                });
            }

            distantClouds = [];
            for (let i = 0; i < 5; i++) {
                distantClouds.push({
                    x: Math.random() * width,
                    y: Math.random() * (height * 0.7),
                    scale: Math.random() * 0.5 + 0.5,
                    speed: Math.random() * 0.3 + 0.2,
                    opacity: Math.random() * 0.2 + 0.1
                });
            }
        }

        class Unicorn {
            constructor() {
                this.x = width * 0.25;
                this.y = height / 2;
                this.radius = 18;
                this.velocity = 0;
                this.rotation = 0;
                this.wingAngle = 0;
            }

            reset() {
                this.y = height / 2;
                this.velocity = 0;
                this.rotation = 0;
            }

            jump() {
                this.velocity = jumpForce;
                for (let i = 0; i < 6; i++) {
                    particles.push(new Particle(this.x - 10, this.y + 5, 'rainbow'));
                }
            }

            update() {
                this.velocity += gravity;
                this.y += this.velocity;

                this.rotation = Math.min(Math.PI / 6, Math.max(-Math.PI / 6, this.velocity * 0.05));
                this.wingAngle += 0.2;

                if (frameCount % 3 === 0) {
                    particles.push(new Particle(this.x - 12, this.y, 'trail'));
                }

                if (this.y - this.radius < 0) {
                    this.y = this.radius;
                    this.velocity = 0;
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);

                // Body
                ctx.fillStyle = '#FFFFFF';
                ctx.beginPath();
                ctx.ellipse(0, 0, 20, 14, 0, 0, Math.PI * 2);
                ctx.fill();

                // Head
                ctx.beginPath();
                ctx.arc(12, -8, 10, 0, Math.PI * 2);
                ctx.fill();

                // Blush
                ctx.fillStyle = '#ffb6c1';
                ctx.beginPath();
                ctx.arc(15, -5, 3, 0, Math.PI * 2);
                ctx.fill();

                // Eye
                ctx.fillStyle = '#2b1055';
                ctx.beginPath();
                ctx.arc(15, -10, 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(16, -11, 0.7, 0, Math.PI * 2);
                ctx.fill();

                // Horn
                ctx.fillStyle = '#ffd700';
                ctx.beginPath();
                ctx.moveTo(14, -16);
                ctx.lineTo(24, -22);
                ctx.lineTo(18, -13);
                ctx.closePath();
                ctx.fill();

                // Mane
                const maneColors = ['#ff758c', '#ff7eb3', '#a1c4fd', '#c2e9fb'];
                maneColors.forEach((color, idx) => {
                    ctx.fillStyle = color;
                    ctx.beginPath();
                    ctx.arc(-2 - (idx * 4), -12 + (idx * 2), 5, 0, Math.PI * 2);
                    ctx.fill();
                });

                // Tail
                maneColors.forEach((color, idx) => {
                    ctx.fillStyle = color;
                    ctx.beginPath();
                    ctx.arc(-20 - (idx * 3), 0 + (idx * 3), 4, 0, Math.PI * 2);
                    ctx.fill();
                });

                // Wing
                ctx.fillStyle = '#f3e5f5';
                ctx.beginPath();
                const wingY = Math.sin(this.wingAngle) * 4;
                ctx.ellipse(-2, -2 + wingY, 8, 12, Math.PI / 4, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.size = Math.random() * 4 + 2;
                this.vx = (Math.random() - 0.5) * 1.5 - 1;
                this.vy = (Math.random() - 0.5) * 1.5;
                this.life = 1;
                this.decay = Math.random() * 0.03 + 0.02;

                const colors = ['#ff9a9e', '#fecfef', '#a1c4fd', '#e0c3fc', '#ffd700'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class CloudObstacle {
            constructor() {
                this.x = width + 60;
                this.width = 65;
                this.passed = false;

                const minHeight = 80;
                const maxHeight = height - cloudGap - minHeight;
                this.topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;
                this.bottomY = this.topHeight + cloudGap;
            }

            update() {
                this.x -= cloudSpeed;
            }

            drawCloudPillar(startX, startY, pWidth, pHeight, isTop) {
                ctx.save();
                ctx.fillStyle = '#ffffff';
                
                ctx.beginPath();
                ctx.roundRect(startX, startY, pWidth, pHeight, 20);
                ctx.fill();

                ctx.fillStyle = '#f0e6ff';
                const puffCount = Math.floor(pHeight / 30);
                for (let i = 0; i <= puffCount; i++) {
                    const py = isTop ? startY + (i * 30) : startY + pHeight - (i * 30);
                    ctx.beginPath();
                    ctx.arc(startX, py, 18, 0, Math.PI * 2);
                    ctx.arc(startX + pWidth, py, 18, 0, Math.PI * 2);
                    ctx.fill();
                }

                const capY = isTop ? startY + pHeight : startY;
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(startX - 5, capY, 22, 0, Math.PI * 2);
                ctx.arc(startX + pWidth / 2, capY + (isTop ? 6 : -6), 26, 0, Math.PI * 2);
                ctx.arc(startX + pWidth + 5, capY, 22, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = 'rgba(255, 182, 193, 0.3)';
                ctx.beginPath();
                ctx.arc(startX + pWidth / 2, capY + (isTop ? 2 : -2), 16, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            draw() {
                this.drawCloudPillar(this.x - this.width/2, 0, this.width, this.topHeight, true);
                this.drawCloudPillar(this.x - this.width/2, this.bottomY, this.width, height - this.bottomY, false);
            }

            checkCollision(player) {
                const px = player.x;
                const py = player.y;
                const pr = player.radius - 3;

                const left = this.x - this.width / 2;
                const right = this.x + this.width / 2;

                if (px + pr > left && px - pr < right) {
                    if (py - pr < this.topHeight || py + pr > this.bottomY) {
                        return true;
                    }
                }
                return false;
            }
        }

        unicorn = new Unicorn();
        initBackground();

        function gameLoop() {
            frameCount++;
            ctx.clearRect(0, 0, width, height);

            drawBackground();

            if (gameState === 'PLAYING') {
                if (frameCount % cloudFrequency === 0) {
                    clouds.push(new CloudObstacle());
                }

                unicorn.update();

                if (unicorn.y + unicorn.radius >= height - 10) {
                    triggerGameOver();
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].life <= 0) particles.splice(i, 1);
            }

            for (let i = clouds.length - 1; i >= 0; i--) {
                const cloud = clouds[i];
                if (gameState === 'PLAYING') {
                    cloud.update();

                    if (!cloud.passed && cloud.x < unicorn.x) {
                        cloud.passed = true;
                        score++;
                        scoreHud.innerText = score;
                    }

                    if (cloud.checkCollision(unicorn)) {
                        triggerGameOver();
                    }
                }

                cloud.draw();

                if (cloud.x < -80) {
                    clouds.splice(i, 1);
                }
            }

            unicorn.draw();

            requestAnimationFrame(gameLoop);
        }

        function drawBackground() {
            ctx.fillStyle = '#ffffff';
            backgroundStars.forEach(star => {
                ctx.globalAlpha = star.alpha;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();

                if (gameState === 'PLAYING') {
                    star.x -= star.speed;
                    if (star.x < 0) star.x = width;
                }
            });
            ctx.globalAlpha = 1.0;

            distantClouds.forEach(dc => {
                ctx.save();
                ctx.fillStyle = `rgba(255, 255, 255, ${dc.opacity})`;
                ctx.beginPath();
                ctx.arc(dc.x, dc.y, 30 * dc.scale, 0, Math.PI * 2);
                ctx.arc(dc.x + 25 * dc.scale, dc.y - 10 * dc.scale, 35 * dc.scale, 0, Math.PI * 2);
                ctx.arc(dc.x + 50 * dc.scale, dc.y, 30 * dc.scale, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                if (gameState === 'PLAYING') {
                    dc.x -= dc.speed;
                    if (dc.x < -100) dc.x = width + 50;
                }
            });
        }

        function handleJump() {
            if (gameState === 'PLAYING') {
                unicorn.jump();
            }
        }

        function startGame() {
            gameState = 'PLAYING';
            score = 0;
            clouds = [];
            particles = [];
            unicorn.reset();
            scoreHud.innerText = '0';

            startOverlay.classList.add('hidden');
            gameoverOverlay.classList.add('hidden');
        }

        function triggerGameOver() {
            gameState = 'GAMEOVER';

            if (score > highScore) {
                highScore = score;
            }

            finalScoreEl.innerText = score;
            bestScoreEl.innerText = highScore;

            gameoverOverlay.classList.remove('hidden');
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                if (gameState === 'PLAYING') handleJump();
                else if (gameState === 'START') startGame();
            }
        });

        container.addEventListener('pointerdown', (e) => {
            if (e.target.tagName === 'BUTTON') return;
            if (gameState === 'PLAYING') {
                handleJump();
            }
        });

        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);

        // Start animation loop
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
