        function App() {
            // Local / Firestore State
            const [opportunities, setOpportunities] = React.useState(SEED_OPPORTUNITIES);
            const [users, setUsers] = React.useState([
                { uid: 'admin-1', displayName: 'School Admin', email: 'admin@nido.cl', role: 'admin' },
                { uid: 'staff-1', displayName: 'Maria Silva', email: 'msilva@nido.cl', role: 'adult_contributor' },
                { uid: 'student-1', displayName: 'Alex Student', email: 'alex@student.nido.cl', role: 'student' }
            ]);
            const [invitations, setInvitations] = React.useState([
                { email: 'mentor-external@partner.org', role: 'adult_contributor', note: 'Robotics Partner' }
            ]);
            const [bookmarks, setBookmarks] = React.useState([]);

            // Navigation & View State
            const [activeTab, setActiveTab] = React.useState('browse');
            const [selectedCategory, setSelectedCategory] = React.useState('all');
            const [searchQuery, setSearchQuery] = React.useState('');
            const [selectedGrade, setSelectedGrade] = React.useState('all');
            const [selectedPathway, setSelectedPathway] = React.useState('all');

            // Modals
            const [activeModalOpportunity, setActiveModalOpportunity] = React.useState(null);
            const [editingOpportunity, setEditingOpportunity] = React.useState(null);
            const [isFirebaseModalOpen, setIsFirebaseModalOpen] = React.useState(false);
            const [toastMessage, setToastMessage] = React.useState(null);

            // Auth State
            const [currentUser, setCurrentUser] = React.useState(null);

            // Firebase instances
            const [isFirebaseConnected, setIsFirebaseConnected] = React.useState(false);
            const [activeFirebaseConfig, setActiveFirebaseConfig] = React.useState(DEFAULT_FIREBASE_CONFIG);
            const [firebaseDb, setFirebaseDb] = React.useState(null);
            const [firebaseAuth, setFirebaseAuth] = React.useState(null);

            const showToast = (msg, type = 'info') => {
                setToastMessage({ message: msg, type });
                setTimeout(() => setToastMessage(null), 4500);
            };

            // Initialize or load Firebase config
            const initFirebase = React.useCallback((config) => {
                if (!window.FirebaseSDK) return;
                try {
                    const { initializeApp, getApps, getApp, getFirestore, getAuth, onAuthStateChanged, collection, onSnapshot, doc, setDoc, getDoc } = window.FirebaseSDK;
                    
                    let app;
                    if (getApps().length > 0) {
                        app = getApp();
                    } else {
                        app = initializeApp(config);
                    }

                    const db = getFirestore(app);
                    const auth = getAuth(app);

                    setFirebaseDb(db);
                    setFirebaseAuth(auth);
                    setIsFirebaseConnected(true);
                    setActiveFirebaseConfig(config);

                    // Listeners are now handled in a separate useEffect based on auth state

                    // Listen to Auth State
                    onAuthStateChanged(auth, async (user) => {
                        if (user) {
                            let role = 'guest'; // Fallback
                            const email = (user.email || '').toLowerCase();
                            
                            if (email.endsWith('@students.nido.cl')) {
                                role = 'student';
                            } else if (email.endsWith('@nido.cl')) {
                                role = 'adult_contributor';
                            }
                            
                            // Keep basic admin override for testing, or allow Firestore to dictate
                            if (email.startsWith('admin') || email.includes('admin@')) {
                                role = 'admin';
                            }

                            try {
                                const userRef = doc(db, 'users', user.uid);
                                const userSnap = await getDoc(userRef);
                                if (userSnap.exists()) {
                                    role = userSnap.data().role || role;
                                } else {
                                    await setDoc(userRef, {
                                        uid: user.uid,
                                        email: user.email,
                                        displayName: user.displayName,
                                        photoURL: user.photoURL,
                                        role: role,
                                        createdAt: new Date().toISOString()
                                    });
                                }
                            } catch (e) {
                                console.error('Error fetching user profile:', e);
                            }

                            setCurrentUser({
                                uid: user.uid,
                                displayName: user.displayName || user.email,
                                email: user.email,
                                photoURL: user.photoURL,
                                role: role
                            });
                            showToast(`Signed in as ${user.email} (${role})`, 'success');
                        } else {
                            setCurrentUser(null);
                        }
                    });

                    showToast(`Connected to Cloud Firestore (${config.projectId})!`, 'success');
                } catch (e) {
                    console.error('Error initializing Firebase:', e);
                    setIsFirebaseConnected(false);
                    showToast('Firebase connection failed: ' + e.message, 'error');
                }
            }, []);

            // Check localStorage or default Firebase config on mount
            React.useEffect(() => {
                const checkAndConnect = () => {
                    try {
                        const saved = localStorage.getItem('nidoships_firebase_config');
                        let configToUse = DEFAULT_FIREBASE_CONFIG;
                        if (saved) {
                            const parsed = parseFirebaseConfigText(saved);
                            if (parsed && parsed.projectId && parsed.apiKey) {
                                configToUse = parsed;
                            }
                        }
                        if (configToUse && configToUse.apiKey && configToUse.projectId) {
                            initFirebase(configToUse);
                        }
                    } catch (e) {
                        console.error('Auto-connect error:', e);
                    }
                };

                if (window.FirebaseSDK) {
                    checkAndConnect();
                } else {
                    window.addEventListener('firebase-sdk-ready', checkAndConnect);
                }
            }, [initFirebase]);

            // Dynamic Data Subscriptions based on Auth State
            React.useEffect(() => {
                if (!firebaseDb || !window.FirebaseSDK) return;
                
                const { collection, query, where, onSnapshot } = window.FirebaseSDK;
                
                // 1. Subscribe to opportunities
                let oppsQuery;
                if (currentUser && currentUser.role === 'admin') {
                    // Admins see everything
                    oppsQuery = collection(firebaseDb, 'opportunities');
                } else if (currentUser && currentUser.role === 'adult_contributor') {
                    // For prototype, let adult contributors see all to avoid missing their own pending ones
                    // In a production app with strict rules, this requires a composite query or multiple queries
                    oppsQuery = collection(firebaseDb, 'opportunities'); 
                } else {
                    // Students only see approved
                    oppsQuery = query(collection(firebaseDb, 'opportunities'), where('status', '==', 'approved'));
                }

                const unsubscribeOpps = onSnapshot(oppsQuery, (snapshot) => {
                    const list = [];
                    snapshot.forEach(d => list.push({ ...d.data(), id: d.id }));
                    setOpportunities(list);
                }, (err) => {
                    console.warn('Firestore opportunities snapshot error:', err);
                    showToast('Error reading opportunities: ' + err.message, 'error');
                });

                // 2. Subscribe to users (Admins only)
                let unsubscribeUsers = () => {};
                if (currentUser && currentUser.role === 'admin') {
                    unsubscribeUsers = onSnapshot(collection(firebaseDb, 'users'), (snapshot) => {
                        const list = [];
                        snapshot.forEach(d => list.push({ ...d.data(), uid: d.id }));
                        setUsers(list);
                    }, (err) => {
                        console.warn('Firestore users snapshot error:', err);
                    });
                } else {
                    setUsers([]);
                }

                return () => {
                    unsubscribeOpps();
                    unsubscribeUsers();
                };
            }, [firebaseDb, currentUser?.role]);

            // Google Sign In
            const handleGoogleSignIn = async () => {
                if (!isFirebaseConnected || !firebaseAuth) {
                    setIsFirebaseModalOpen(true);
                    return;
                }
                try {
                    const { GoogleAuthProvider, signInWithPopup } = window.FirebaseSDK;
                    const provider = new GoogleAuthProvider();
                    await signInWithPopup(firebaseAuth, provider);
                } catch (err) {
                    console.error('Google Sign In Error:', err);
                    showToast('Google Sign In failed: ' + err.message, 'error');
                }
            };

            // Sign Out
            const handleSignOut = async () => {
                if (firebaseAuth && isFirebaseConnected) {
                    const { signOut } = window.FirebaseSDK;
                    await signOut(firebaseAuth);
                }
                setCurrentUser(null);
                setActiveTab('browse');
                showToast('Signed out successfully.');
            };

            // Bookmark toggle
            const handleToggleBookmark = (id) => {
                setBookmarks(prev => 
                    prev.includes(id) ? prev.filter(b => b !== id) : [...prev, id]
                );
                showToast(bookmarks.includes(id) ? 'Removed from saved opportunities' : 'Saved to your bookmarked list!');
            };

            // Opportunity CRUD Actions
            const handleNewSubmission = async (newOpp) => {
                if (isFirebaseConnected && firebaseDb) {
                    try {
                        const { doc, setDoc } = window.FirebaseSDK;
                        await setDoc(doc(firebaseDb, 'opportunities', newOpp.id), newOpp);
                    } catch (e) {
                        console.error('Error adding to Firestore:', e);
                        showToast('Error saving: ' + e.message, 'error');
                        return;
                    }
                }
                setOpportunities(prev => [newOpp, ...prev]);
                setActiveTab('my-postings');
                showToast('Opportunity proposed! It is pending moderation before appearing on the portal.', 'success');
            };

            const handleSaveEdit = async (updatedOpp) => {
                if (isFirebaseConnected && firebaseDb) {
                    try {
                        const { doc, updateDoc } = window.FirebaseSDK;
                        await updateDoc(doc(firebaseDb, 'opportunities', updatedOpp.id), updatedOpp);
                    } catch (e) {
                        console.error('Error updating in Firestore:', e);
                    }
                }
                setOpportunities(prev => prev.map(o => o.id === updatedOpp.id ? updatedOpp : o));
                setEditingOpportunity(null);
                showToast('Opportunity updated successfully.', 'success');
            };

            const handleApprove = async (id) => {
                if (isFirebaseConnected && firebaseDb) {
                    try {
                        const { doc, updateDoc } = window.FirebaseSDK;
                        await updateDoc(doc(firebaseDb, 'opportunities', id), { status: 'approved', reviewNotes: '' });
                    } catch (e) {
                        console.error('Error approving:', e);
                        showToast('Error approving: ' + e.message, 'error');
                        return; // Stop local update if DB failed
                    }
                }
                setOpportunities(prev => prev.map(o => o.id === id ? { ...o, status: 'approved', reviewNotes: '' } : o));
                showToast('Opportunity approved and published live!', 'success');
            };

            const handleRejectWithNote = async (id, note) => {
                if (isFirebaseConnected && firebaseDb) {
                    try {
                        const { doc, updateDoc } = window.FirebaseSDK;
                        await updateDoc(doc(firebaseDb, 'opportunities', id), { status: 'rejected', reviewNotes: note });
                    } catch (e) {
                        console.error('Error rejecting:', e);
                        showToast('Error rejecting: ' + e.message, 'error');
                        return;
                    }
                }
                setOpportunities(prev => prev.map(o => o.id === id ? { ...o, status: 'rejected', reviewNotes: note } : o));
                showToast('Feedback sent to author for revision.');
            };

            const handleDeleteOpportunity = async (id) => {
                if (!confirm('Are you sure you want to remove this opportunity?')) return;
                if (isFirebaseConnected && firebaseDb) {
                    try {
                        const { doc, deleteDoc } = window.FirebaseSDK;
                        await deleteDoc(doc(firebaseDb, 'opportunities', id));
                    } catch (e) {}
                }
                setOpportunities(prev => prev.filter(o => o.id !== id));
                showToast('Opportunity deleted.');
            };

            // User Role Management
            const handleUpdateUserRole = async (uid, newRole) => {
                if (isFirebaseConnected && firebaseDb) {
                    try {
                        const { doc, updateDoc } = window.FirebaseSDK;
                        await updateDoc(doc(firebaseDb, 'users', uid), { role: newRole });
                    } catch (e) {}
                }
                setUsers(prev => prev.map(u => u.uid === uid ? { ...u, role: newRole } : u));
                showToast('User role updated successfully.', 'success');
            };

            const handleSendInvite = async (inviteData) => {
                if (isFirebaseConnected && firebaseDb) {
                    try {
                        const { collection, addDoc } = window.FirebaseSDK;
                        await addDoc(collection(firebaseDb, 'invitations'), {
                            ...inviteData,
                            invitedAt: new Date().toISOString()
                        });
                    } catch (e) {}
                }
                setInvitations(prev => [inviteData, ...prev]);
                showToast(`Invitation created for ${inviteData.email} as ${inviteData.role}`, 'success');
            };

            // Seed sample database
            const handleSeedDatabase = async () => {
                if (isFirebaseConnected && firebaseDb) {
                    try {
                        const { collection, doc, setDoc } = window.FirebaseSDK;
                        for (const seed of SEED_OPPORTUNITIES) {
                            await setDoc(doc(firebaseDb, 'opportunities', seed.id), seed);
                        }
                        showToast('Sample opportunities written to Firestore!', 'success');
                    } catch (e) {
                        console.error('Error seeding Firestore:', e);
                        showToast('Error seeding Firestore: ' + e.message, 'error');
                    }
                } else {
                    setOpportunities(SEED_OPPORTUNITIES);
                    showToast('Sample opportunities loaded locally!', 'success');
                }
            };

            // Filter logic for Student Browse view
            const liveOpportunities = opportunities.filter(o => o.status === 'approved');
            const pendingCount = opportunities.filter(o => o.status === 'pending').length;

            const filteredOpportunities = liveOpportunities.filter(opp => {
                const matchesCat = selectedCategory === 'all' || (opp.types && opp.types.includes(selectedCategory));
                const matchesGrade = selectedGrade === 'all' || (opp.grades && opp.grades.includes(selectedGrade));
                const matchesPathway = selectedPathway === 'all' || opp.pathway === selectedPathway;
                const matchesSearch = searchQuery === '' || 
                    opp.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    opp.description.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    (opp.tags && opp.tags.some(t => t.toLowerCase().includes(searchQuery.toLowerCase()))) ||
                    opp.contactOrg.toLowerCase().includes(searchQuery.toLowerCase());
                
                return matchesCat && matchesGrade && matchesPathway && matchesSearch;
            });

            return (
                <div className="min-h-screen flex flex-col bg-slate-50">
                    
                    {/* TOP NAVBAR */}
                    <header className="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-xs">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4">
                            
                            {/* Logo */}
                            <div 
                                className="flex items-center gap-3 cursor-pointer select-none" 
                                onClick={() => setActiveTab('browse')}
                            >
                                <div className="w-11 h-11 rounded-2xl bg-slate-900 flex items-center justify-center text-white shadow-md">
                                    <span className="font-black text-2xl tracking-tighter">N</span>
                                </div>
                                <div>
                                    <div className="font-black text-xl tracking-tight text-slate-900">Nidoships</div>
                                    <div className="text-[10px] font-bold text-slate-400 uppercase tracking-widest -mt-1">Campus Hub</div>
                                </div>
                            </div>

                            {/* View Navigation */}
                            <nav className="hidden md:flex items-center bg-slate-100 p-1.5 rounded-2xl border border-slate-200/80">
                                <button 
                                    onClick={() => setActiveTab('browse')}
                                    className={`px-4 py-2 rounded-xl text-xs font-bold transition-all ${
                                        activeTab === 'browse' ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-500 hover:text-slate-900'
                                    }`}
                                >
                                    Browse Opportunities
                                </button>

                                <button 
                                    onClick={() => setActiveTab('submit')}
                                    className={`px-4 py-2 rounded-xl text-xs font-bold transition-all ${
                                        activeTab === 'submit' ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-500 hover:text-slate-900'
                                    }`}
                                >
                                    Propose Nidoship
                                </button>

                                {currentUser && (currentUser.role === 'adult_contributor' || currentUser.role === 'admin') && (
                                    <button 
                                        onClick={() => setActiveTab('my-postings')}
                                        className={`px-4 py-2 rounded-xl text-xs font-bold transition-all ${
                                            activeTab === 'my-postings' ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-500 hover:text-slate-900'
                                        }`}
                                    >
                                        My Postings
                                    </button>
                                )}

                                {currentUser?.role === 'admin' && (
                                    <button 
                                        onClick={() => setActiveTab('admin')}
                                        className={`px-4 py-2 rounded-xl text-xs font-bold transition-all relative ${
                                            activeTab === 'admin' ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-500 hover:text-slate-900'
                                        }`}
                                    >
                                        Admin Hub
                                        {pendingCount > 0 && (
                                            <span className="ml-2 bg-amber-500 text-white text-[10px] px-1.5 py-0.5 rounded-full font-bold">
                                                {pendingCount}
                                            </span>
                                        )}
                                    </button>
                                )}
                            </nav>

                            {/* User & Status Bar */}
                            <div className="flex items-center gap-3">
                                
                                {/* Live Firestore Badge */}
                                {isFirebaseConnected ? (
                                    <div 
                                        onClick={() => setIsFirebaseModalOpen(true)}
                                        className="hidden sm:flex items-center gap-1.5 bg-emerald-50 text-emerald-800 border border-emerald-200 px-3 py-1.5 rounded-2xl text-xs font-bold cursor-pointer hover:bg-emerald-100 transition-colors"
                                        title="Click to view Firebase project settings"
                                    >
                                        <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                                        <span>Firestore: {activeFirebaseConfig?.projectId || 'Connected'}</span>
                                    </div>
                                ) : (
                                    <button 
                                        onClick={() => setIsFirebaseModalOpen(true)}
                                        className="hidden sm:flex items-center gap-1.5 bg-amber-50 text-amber-800 border border-amber-200 px-3 py-1.5 rounded-2xl text-xs font-bold hover:bg-amber-100 transition-colors"
                                    >
                                        <span className="w-2 h-2 rounded-full bg-amber-500"></span>
                                        <span>Connect Firebase</span>
                                    </button>
                                )}



                                {/* Google Sign In / User Profile */}
                                {currentUser?.email && isFirebaseConnected && currentUser.uid !== 'demo-student' ? (
                                    <div className="flex items-center gap-2">
                                        <div className="text-right hidden sm:block">
                                            <div className="text-xs font-bold text-slate-900 leading-tight">{currentUser.displayName}</div>
                                            <div className="text-[10px] text-slate-400">{currentUser.role}</div>
                                        </div>
                                        <button 
                                            onClick={handleSignOut}
                                            className="px-3 py-2 rounded-xl border border-slate-200 text-xs font-semibold text-slate-600 hover:bg-slate-50"
                                        >
                                            Sign Out
                                        </button>
                                    </div>
                                ) : (
                                    <button 
                                        onClick={handleGoogleSignIn}
                                        className="inline-flex items-center gap-2 bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold px-4 py-2.5 rounded-2xl transition-all shadow-xs"
                                    >
                                        <span>G</span>
                                        <span>Google Sign In</span>
                                    </button>
                                )}

                            </div>

                        </div>

                        {/* Mobile Bar */}
                        <div className="md:hidden border-t border-slate-100 px-4 py-2 flex justify-around bg-slate-50 text-xs font-bold">
                            <button onClick={() => setActiveTab('browse')} className={activeTab === 'browse' ? 'text-brand-600' : 'text-slate-500'}>Browse</button>
                            <button onClick={() => setActiveTab('submit')} className={activeTab === 'submit' ? 'text-brand-600' : 'text-slate-500'}>Propose</button>
                            {currentUser && (currentUser.role === 'adult_contributor' || currentUser.role === 'admin') && (
                                <button onClick={() => setActiveTab('my-postings')} className={activeTab === 'my-postings' ? 'text-brand-600' : 'text-slate-500'}>My Posts</button>
                            )}
                            {currentUser?.role === 'admin' && (
                                <button onClick={() => setActiveTab('admin')} className={activeTab === 'admin' ? 'text-brand-600' : 'text-slate-500'}>Admin ({pendingCount})</button>
                            )}
                        </div>
                    </header>

                    {/* MAIN CONTENT AREA */}
                    <main className="flex-1 pb-16">
                        
                        {!currentUser ? (
                            <div className="flex flex-col items-center justify-center min-h-[60vh] text-center px-4">
                                <div className="w-20 h-20 bg-brand-100 text-brand-600 rounded-full flex items-center justify-center mb-6">
                                    <svg className="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                                </div>
                                <h2 className="text-3xl font-black text-slate-900 mb-4">Nidoships Portal</h2>
                                <p className="text-slate-600 max-w-md mb-8">
                                    Please sign in with your Nido de Aguilas Google account to browse and propose opportunities.
                                </p>
                                <button 
                                    onClick={handleGoogleSignIn}
                                    className="bg-brand-600 hover:bg-brand-700 text-white px-8 py-3.5 rounded-2xl font-bold transition-all shadow-md hover:shadow-xl hover:-translate-y-0.5 flex items-center gap-3"
                                >
                                    <svg className="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
                                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                                    </svg>
                                    Sign in with Google
                                </button>
                            </div>
                        ) : (
                            <>
                                {/* TAB 1: BROWSE OPPORTUNITIES */}
                                {activeTab === 'browse' && (
                            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8 animate-fade-in">
                                
                                <div className="text-center max-w-3xl mx-auto pt-4 pb-2 space-y-3">
                                    <div className="inline-flex items-center gap-2 bg-brand-50 border border-brand-200 text-brand-700 px-3.5 py-1 rounded-full text-xs font-bold uppercase tracking-wider">
                                        <span>🎓</span> Campus Experiential Learning
                                    </div>
                                    <h1 className="text-3xl sm:text-5xl font-black text-slate-900 tracking-tight">
                                        Explore Campus Opportunities
                                    </h1>
                                    <p className="text-slate-500 text-base sm:text-lg font-normal">
                                        Discover on-campus internships, partner externships, guided mentorships, and leadership experiences tailored for students.
                                    </p>
                                </div>

                                {/* Category Filter Pills */}
                                <div className="flex items-center justify-center flex-wrap gap-2 sm:gap-3 py-2">
                                    <button 
                                        onClick={() => setSelectedCategory('all')}
                                        className={`px-4 py-2 rounded-full text-xs font-bold transition-all border ${
                                            selectedCategory === 'all' 
                                                ? 'bg-slate-900 text-white border-slate-900 shadow-xs' 
                                                : 'bg-white text-slate-600 border-slate-200 hover:border-slate-300'
                                        }`}
                                    >
                                        All Opportunities ({liveOpportunities.length})
                                    </button>

                                    {Object.entries(CATEGORIES).map(([key, cat]) => {
                                        const isSelected = selectedCategory === key;
                                        const count = liveOpportunities.filter(o => o.types && o.types.includes(key)).length;
                                        return (
                                            <button 
                                                key={key}
                                                onClick={() => setSelectedCategory(key)}
                                                className={`inline-flex items-center gap-2 px-4 py-2 rounded-full text-xs font-bold transition-all border ${
                                                    isSelected 
                                                        ? `${cat.pillBorder} ring-2 ring-slate-900/10 shadow-xs` 
                                                        : 'bg-white text-slate-700 border-slate-200 hover:border-slate-300'
                                                }`}
                                            >
                                                <span>{cat.icon}</span>
                                                <span>{cat.label}</span>
                                                <span className="opacity-60 text-[11px]">({count})</span>
                                            </button>
                                        );
                                    })}
                                </div>

                                {/* Search, Grade & Pathway Toolbar */}
                                <div className="bg-white rounded-3xl border border-slate-200 p-4 sm:p-5 shadow-2xs flex flex-col md:flex-row gap-4 items-center justify-between">
                                    <div className="relative w-full md:w-80">
                                        <input 
                                            type="text" 
                                            placeholder="Search title, keyword, host..."
                                            value={searchQuery}
                                            onChange={e => setSearchQuery(e.target.value)}
                                            className="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-2xl text-xs font-medium focus:outline-none focus:bg-white focus:border-brand-500 transition-all"
                                        />
                                    </div>

                                    <div className="w-full md:w-auto">
                                        <select 
                                            value={selectedPathway}
                                            onChange={e => setSelectedPathway(e.target.value)}
                                            className="w-full md:w-auto px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-2xl text-xs font-semibold focus:outline-none bg-white text-slate-700"
                                        >
                                            <option value="all">All Pathways / Subjects</option>
                                            {PATHWAYS.map(p => (
                                                <option key={p} value={p}>{p}</option>
                                            ))}
                                        </select>
                                    </div>

                                    <div className="flex items-center gap-1.5 w-full md:w-auto overflow-x-auto pb-1 md:pb-0">
                                        <span className="text-xs font-bold text-slate-400 uppercase shrink-0 mr-1">Grade:</span>
                                        {['all', '6th', '7th', '8th', '9th', '10th', '11th', '12th'].map(grade => (
                                            <button 
                                                key={grade}
                                                onClick={() => setSelectedGrade(grade)}
                                                className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${
                                                    selectedGrade === grade 
                                                        ? 'bg-slate-900 text-white shadow-xs' 
                                                        : 'text-slate-500 hover:text-slate-800 hover:bg-slate-100'
                                                }`}
                                            >
                                                {grade === 'all' ? 'All' : grade}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* Opportunities Grid */}
                                {filteredOpportunities.length === 0 ? (
                                    <div className="bg-white rounded-3xl border border-slate-200 p-12 text-center text-slate-500 my-8 space-y-3">
                                        <div className="text-3xl">🔍</div>
                                        <p className="font-bold text-slate-800 text-lg">No opportunities found matching your filters</p>
                                        <p className="text-xs text-slate-400">Try adjusting your keyword search, category, or eligible grade level.</p>
                                        <button 
                                            onClick={() => { setSelectedCategory('all'); setSearchQuery(''); setSelectedGrade('all'); setSelectedPathway('all'); }}
                                            className="mt-2 text-xs font-bold text-brand-600 hover:underline inline-block"
                                        >
                                            Reset All Filters
                                        </button>
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                        {filteredOpportunities.map(opp => (
                                            <OpportunityCard 
                                                key={opp.id} 
                                                opportunity={opp} 
                                                onClick={() => setActiveModalOpportunity(opp)}
                                                isBookmarked={bookmarks.includes(opp.id)}
                                                onToggleBookmark={handleToggleBookmark}
                                            />
                                        ))}
                                    </div>
                                )}

                            </div>
                        )}

                        {/* TAB 2: PROPOSE FORM */}
                        {activeTab === 'submit' && (
                            <SubmissionForm 
                                currentUser={currentUser}
                                onSubmitSuccess={handleNewSubmission} 
                                onCancel={() => setActiveTab('browse')} 
                            />
                        )}

                        {/* TAB 3: MY POSTINGS */}
                        {activeTab === 'my-postings' && (
                            <MySubmissions 
                                opportunities={opportunities}
                                currentUser={currentUser}
                                onEdit={(opp) => setEditingOpportunity(opp)}
                                onDelete={handleDeleteOpportunity}
                                onPreview={(opp) => setActiveModalOpportunity(opp)}
                                onNewProposal={() => setActiveTab('submit')}
                            />
                        )}

                        {/* TAB 4: ADMIN HUB */}
                        {activeTab === 'admin' && (
                            <AdminDashboard 
                                opportunities={opportunities}
                                users={users}
                                invitations={invitations}
                                onApprove={handleApprove}
                                onRejectWithNote={handleRejectWithNote}
                                onEdit={(opp) => setEditingOpportunity(opp)}
                                onDelete={handleDeleteOpportunity}
                                onPreview={(opp) => setActiveModalOpportunity(opp)}
                                onUpdateUserRole={handleUpdateUserRole}
                                onSendInvite={handleSendInvite}
                                onSeedDatabase={handleSeedDatabase}
                                isFirebaseConnected={isFirebaseConnected}
                                activeProjectId={activeFirebaseConfig?.projectId}
                                onOpenFirebaseConfig={() => setIsFirebaseModalOpen(true)}
                            />
                        )}
                            </>
                        )}
                    </main>

                    {/* Admin/User Edit Modal Overlay */}
                    {editingOpportunity && (
                        <div className="fixed inset-0 z-50 overflow-y-auto bg-slate-900/60 backdrop-blur-sm p-4 flex items-center justify-center">
                            <div className="w-full max-w-4xl max-h-[90vh] overflow-y-auto my-auto">
                                <SubmissionForm 
                                    initialData={editingOpportunity}
                                    currentUser={currentUser}
                                    isEditing={true}
                                    onSubmitSuccess={handleSaveEdit}
                                    onCancel={() => setEditingOpportunity(null)}
                                />
                            </div>
                        </div>
                    )}

                    {/* Student Full View Modal */}
                    <OpportunityModal 
                        opportunity={activeModalOpportunity}
                        onClose={() => setActiveModalOpportunity(null)}
                        isBookmarked={activeModalOpportunity ? bookmarks.includes(activeModalOpportunity.id) : false}
                        onToggleBookmark={handleToggleBookmark}
                    />

                    {/* Firebase Credentials Modal */}
                    <FirebaseConfigModal 
                        isOpen={isFirebaseModalOpen}
                        onClose={() => setIsFirebaseModalOpen(false)}
                        activeConfig={activeFirebaseConfig}
                        onSaveConfig={(cfg) => {
                            localStorage.setItem('nidoships_firebase_config', JSON.stringify(cfg));
                            initFirebase(cfg);
                        }}
                        isConnected={isFirebaseConnected}
                    />

                    {/* Toast Notification */}
                    <Toast 
                        message={toastMessage?.message}
                        type={toastMessage?.type}
                        onClose={() => setToastMessage(null)}
                    />

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

    </script>
</body>
</html>
