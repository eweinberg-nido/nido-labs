<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nido Coaching Relationship Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">

  <!-- Navigation Header -->
  <header class="bg-indigo-900 text-white shadow-lg sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <i class="fa-solid me-2 fa-route text-amber-400 text-2xl"></i>
        <h1 class="text-xl font-bold tracking-wide">Nido Coaching Hub</h1>
      </div>
      <div id="auth-container" class="flex items-center space-x-3">
        <button id="login-btn" class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-semibold px-4 py-2 rounded-lg transition text-sm flex items-center gap-2">
          <i class="fa-brands fa-google"></i> Sign In with Nido Google
        </button>
        <div id="user-info" class="hidden flex items-center space-x-3">
          <span id="user-display-name" class="text-sm font-medium text-slate-200"></span>
          <button id="logout-btn" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded transition">
            Sign Out
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main App Layout -->
  <main class="flex-grow max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

    <!-- Sidebar Search & Selection -->
    <aside class="lg:col-span-4 bg-white rounded-xl shadow-sm border border-slate-200 p-4 flex flex-col h-[calc(100vh-7rem)] sticky top-20">
      <div class="flex justify-between items-center mb-4">
        <h2 class="font-bold text-slate-800 text-lg">Coaching Directory</h2>
        <div class="flex gap-2">
          <button id="open-import-modal-btn" title="Import Spreadsheet Data" class="p-2 text-slate-600 hover:text-indigo-600 hover:bg-slate-100 rounded-lg text-sm transition">
            <i class="fa-solid fa-file-import"></i>
          </button>
          <button id="open-log-modal-btn" title="Log New Interaction" class="p-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm transition">
            <i class="fa-solid fa-plus"></i>
          </button>
        </div>
      </div>

      <!-- Search Input -->
      <div class="relative mb-4">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400"></i>
        <input type="text" id="teacher-search" placeholder="Search teacher or subject..." 
               class="w-full pl-9 pr-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
      </div>

      <!-- Teacher List -->
      <div id="teacher-list" class="flex-grow overflow-y-auto space-y-2 pr-1">
        <p class="text-xs text-slate-400 text-center py-6">Sign in to load coaching relationships...</p>
      </div>
    </aside>

    <!-- Main Content Panel: Relationship Arc / Timeline -->
    <section class="lg:col-span-8 bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex flex-col min-h-[600px]">
      <div id="timeline-container">
        <div class="text-center py-20 text-slate-400">
          <i class="fa-solid fa-users-line text-5xl mb-3 text-slate-300"></i>
          <p class="text-base font-medium">Select a teacher from the directory to view their coaching arc.</p>
        </div>
      </div>
    </section>
  </main>

  <!-- Log Interaction Modal -->
  <div id="log-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-lg overflow-hidden border border-slate-100">
      <div class="bg-indigo-900 text-white px-6 py-4 flex justify-between items-center">
        <h3 class="font-bold text-lg"><i class="fa-solid fa-pen-to-square me-2"></i>Log Coaching Touchpoint</h3>
        <button id="close-log-modal" class="text-slate-300 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <form id="log-form" class="p-6 space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Teacher Name</label>
          <input type="text" id="log-teacher-name" list="teacher-suggestions" required placeholder="Type or select name..." 
                 class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          <datalist id="teacher-suggestions"></datalist>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Interaction Type</label>
            <select id="log-type" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
              <option value="Co-Planning">Co-Planning</option>
              <option value="Co-Teaching">Co-Teaching</option>
              <option value="Observation">Observation</option>
              <option value="Debrief / Reflection">Debrief / Reflection</option>
              <option value="Casual Touchpoint">Casual Touchpoint</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Date</label>
            <input type="date" id="log-date" required class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Notes / Key Discussion</label>
          <textarea id="log-notes" rows="4" placeholder="What was discussed or noticed during this interaction?" 
                    class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
        </div>
        <div class="flex justify-end gap-3 pt-2">
          <button type="button" id="cancel-log-btn" class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg">Cancel</button>
          <button type="submit" class="px-4 py-2 text-sm bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-medium shadow-sm">Save Log</button>
        </div>
      </form>
    </div>
  </div>

  <!-- TSV Import Modal -->
  <div id="import-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-2xl overflow-hidden border border-slate-100">
      <div class="bg-slate-800 text-white px-6 py-4 flex justify-between items-center">
        <h3 class="font-bold text-lg"><i class="fa-solid fa-file-import me-2"></i>Import Coaching Form Sheet</h3>
        <button id="close-import-modal" class="text-slate-300 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <div class="p-6 space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Division</label>
          <select id="import-division" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg">
            <option value="MSHS">MS / HS Division</option>
            <option value="EYSES">EYS / ES Division</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Paste Tab-Separated Data (Directly from Google Sheets)</label>
          <p class="text-xs text-slate-500 mb-2">Copy rows (excluding headers) straight from the spreadsheet and paste them below.</p>
          <textarea id="import-data" rows="8" placeholder="Paste data rows here..." 
                    class="w-full font-mono text-xs p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
        </div>
        <div class="flex justify-end gap-3 pt-2">
          <button id="cancel-import-btn" class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg">Cancel</button>
          <button id="run-import-btn" class="px-4 py-2 text-sm bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-medium shadow-sm">Import Records</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modular Firebase Application Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, query, where, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Firebase Config embedded directly
    const firebaseConfig = {
      apiKey: "AIzaSyAFhiLa94zjP8IakzEd4nvtJOH-HRX10fI",
      authDomain: "nido-teaching-learning.firebaseapp.com",
      projectId: "nido-teaching-learning",
      storageBucket: "nido-teaching-learning.firebasestorage.app",
      messagingSenderId: "167104058821",
      appId: "1:167104058821:web:7ca1f5c91ddcb68df1a7ac"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const googleProvider = new GoogleAuthProvider();

    let currentUser = null;
    let selectedTeacherName = null;
    let allTeachersMap = new Map();

    // DOM Elements
    const loginBtn = document.getElementById('login-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const userInfo = document.getElementById('user-info');
    const userDisplayName = document.getElementById('user-display-name');
    const teacherListContainer = document.getElementById('teacher-list');
    const timelineContainer = document.getElementById('timeline-container');
    const searchInput = document.getElementById('teacher-search');

    // Modals
    const logModal = document.getElementById('log-modal');
    const openLogBtn = document.getElementById('open-log-modal-btn');
    const closeLogBtn = document.getElementById('close-log-modal');
    const cancelLogBtn = document.getElementById('cancel-log-btn');
    const logForm = document.getElementById('log-form');
    const logDateInput = document.getElementById('log-date');

    const importModal = document.getElementById('import-modal');
    const openImportBtn = document.getElementById('open-import-modal-btn');
    const closeImportBtn = document.getElementById('close-import-modal');
    const cancelImportBtn = document.getElementById('cancel-import-btn');
    const runImportBtn = document.getElementById('run-import-btn');

    // Set Default Log Date to Today
    logDateInput.value = new Date().toISOString().split('T')[0];

    // Authentication Handlers
    loginBtn.onclick = () => signInWithPopup(auth, googleProvider);
    logoutBtn.onclick = () => signOut(auth);

    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      if (user) {
        if (!user.email.endsWith('@nido.cl')) {
          alert('Access restricted to @nido.cl accounts.');
          signOut(auth);
          return;
        }
        loginBtn.classList.add('hidden');
        userInfo.classList.remove('hidden');
        userDisplayName.textContent = user.displayName || user.email;
        loadDirectory();
      } else {
        loginBtn.classList.remove('hidden');
        userInfo.classList.add('hidden');
        teacherListContainer.innerHTML = '<p class="text-xs text-slate-400 text-center py-6">Sign in to load coaching relationships...</p>';
        timelineContainer.innerHTML = '<div class="text-center py-20 text-slate-400"><i class="fa-solid fa-users-line text-5xl mb-3 text-slate-300"></i><p class="text-base font-medium">Select a teacher from the directory to view their coaching arc.</p></div>';
      }
    });

    // Modal Control Functions
    const toggleModal = (modal, show) => modal.classList.toggle('hidden', !show);
    openLogBtn.onclick = () => toggleModal(logModal, true);
    closeLogBtn.onclick = cancelLogBtn.onclick = () => toggleModal(logModal, false);
    openImportBtn.onclick = () => toggleModal(importModal, true);
    closeImportBtn.onclick = cancelImportBtn.onclick = () => toggleModal(importModal, false);

    // Dynamic Autocomplete and Directory Loading
    async function loadDirectory() {
      if (!currentUser) return;

      const invitesSnap = await getDocs(collection(db, 'coaching-invites'));
      const logsSnap = await getDocs(collection(db, 'coaching-interactions'));

      allTeachersMap.clear();

      // Process Invites
      invitesSnap.forEach(docSnap => {
        const data = docSnap.data();
        const name = (data.name || 'Unknown Teacher').trim();
        if (!allTeachersMap.has(name)) {
          allTeachersMap.set(name, { name, email: data.email, grade: data.grade, subject: data.subject, invite: data, logs: [] });
        } else {
          allTeachersMap.get(name).invite = data;
        }
      });

      // Process Interaction Logs
      logsSnap.forEach(docSnap => {
        const data = docSnap.data();
        const name = (data.teacherName || 'Unknown Teacher').trim();
        if (!allTeachersMap.has(name)) {
          allTeachersMap.set(name, { name, email: '', grade: '', subject: '', invite: null, logs: [data] });
        } else {
          allTeachersMap.get(name).logs.push(data);
        }
      });

      // Populate Autocomplete DataList
      const datalist = document.getElementById('teacher-suggestions');
      datalist.innerHTML = Array.from(allTeachersMap.keys())
        .map(name => `<option value="${name}">`).join('');

      renderTeacherList();
    }

    // Render Directory Sidebar
    function renderTeacherList(filterTerm = '') {
      const term = filterTerm.toLowerCase();
      const filtered = Array.from(allTeachersMap.values()).filter(t => 
        t.name.toLowerCase().includes(term) || (t.subject && t.subject.toLowerCase().includes(term))
      );

      if (filtered.length === 0) {
        teacherListContainer.innerHTML = '<p class="text-xs text-slate-400 text-center py-4">No matching teachers found.</p>';
        return;
      }

      teacherListContainer.innerHTML = filtered.map(teacher => `
        <div onclick="selectTeacher('${teacher.name.replace(/'/g, "\\'")}')" 
             class="p-3 rounded-lg border border-slate-100 hover:border-indigo-300 hover:bg-indigo-50/50 cursor-pointer transition ${selectedTeacherName === teacher.name ? 'bg-indigo-50 border-indigo-400' : 'bg-white'}">
          <div class="font-bold text-slate-800 text-sm">${teacher.name}</div>
          <div class="text-xs text-slate-500 flex justify-between mt-1">
            <span>${teacher.grade || 'N/A'} • ${teacher.subject || 'General'}</span>
            <span class="bg-indigo-100 text-indigo-700 font-semibold px-2 py-0.5 rounded-full text-[10px]">${teacher.logs.length} interactions</span>
          </div>
        </div>
      `).join('');
    }

    searchInput.oninput = (e) => renderTeacherList(e.target.value);

    // Global selector for teacher profile cards
    window.selectTeacher = (name) => {
      selectedTeacherName = name;
      document.getElementById('log-teacher-name').value = name;
      renderTeacherList(searchInput.value);
      renderTimeline(allTeachersMap.get(name));
    };

    // Render Timeline / Coaching Arc Card
    function renderTimeline(teacher) {
      if (!teacher) return;

      const invite = teacher.invite;
      const logs = [...teacher.logs].sort((a, b) => new Date(b.date) - new Date(a.date));

      let inviteSection = invite ? `
        <div class="bg-amber-50/60 border border-amber-200 rounded-lg p-4 mb-6">
          <div class="flex justify-between items-start mb-2">
            <span class="text-xs font-bold uppercase text-amber-800 tracking-wider"><i class="fa-solid fa-paper-plane me-1"></i> Original Coaching Invite Request</span>
            <span class="text-xs text-amber-700 font-medium">${invite.timestamp || ''}</span>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs mb-3 text-slate-700">
            <div><strong class="text-slate-900">Student Learning Goal:</strong> ${invite.studentGoal || 'None listed'}</div>
            <div><strong class="text-slate-900">Instructional Goal:</strong> ${invite.instructionalGoal || 'None listed'}</div>
            <div><strong class="text-slate-900">Co-Planning Blocks:</strong> ${invite.coPlanningBlocks || 'Flexible'}</div>
            <div><strong class="text-slate-900">Co-Teaching Blocks:</strong> ${invite.coTeachingBlocks || 'Flexible'}</div>
            <div><strong class="text-slate-900">Partnership Type:</strong> ${invite.partnershipStyle || 'Standard'}</div>
            <div><strong class="text-slate-900">Start Date:</strong> ${invite.startDate || 'Immediate'}</div>
          </div>
          ${invite.tags ? `<span class="inline-block bg-amber-200 text-amber-900 text-[10px] font-semibold px-2 py-0.5 rounded">${invite.tags}</span>` : ''}
        </div>
      ` : `<p class="text-xs text-slate-400 italic mb-6">No direct coaching invite record on file (log-only contact).</p>`;

      let interactionsSection = logs.length > 0 ? logs.map(log => `
        <div class="relative pl-6 pb-6 border-l-2 border-indigo-200 last:border-l-0">
          <div class="absolute -left-[9px] top-0 w-4 h-4 rounded-full bg-indigo-600 border-2 border-white"></div>
          <div class="bg-slate-50 border border-slate-200 rounded-lg p-3">
            <div class="flex justify-between items-center mb-1">
              <span class="font-bold text-xs text-indigo-900">${log.type}</span>
              <span class="text-xs text-slate-400">${log.date}</span>
            </div>
            <p class="text-xs text-slate-700 whitespace-pre-wrap">${log.notes || 'No notes added.'}</p>
          </div>
        </div>
      `).join('') : '<p class="text-xs text-slate-400">No interaction logs captured yet.</p>';

      timelineContainer.innerHTML = `
        <div class="flex justify-between items-start border-b border-slate-200 pb-4 mb-4">
          <div>
            <h2 class="text-2xl font-bold text-slate-900">${teacher.name}</h2>
            <p class="text-xs text-slate-500">${teacher.grade || 'Grade N/A'} • ${teacher.subject || 'Subject N/A'} ${teacher.email ? `• ${teacher.email}` : ''}</p>
          </div>
          <button onclick="document.getElementById('open-log-modal-btn').click()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs px-3 py-2 rounded-lg font-medium flex items-center gap-1.5 transition">
            <i class="fa-solid fa-plus"></i> Add Interaction
          </button>
        </div>
        ${inviteSection}
        <h3 class="font-bold text-slate-800 text-sm mb-3">Interaction Arc Timeline</h3>
        <div class="space-y-1">${interactionsSection}</div>
      `;
    }

    // Save Log Form Interaction
    logForm.onsubmit = async (e) => {
      e.preventDefault();
      if (!currentUser) return;

      const teacherName = document.getElementById('log-teacher-name').value.trim();
      const type = document.getElementById('log-type').value;
      const date = document.getElementById('log-date').value;
      const notes = document.getElementById('log-notes').value.trim();

      await addDoc(collection(db, 'coaching-interactions'), {
        teacherName,
        type,
        date,
        notes,
        loggedBy: currentUser.email,
        createdAt: serverTimestamp()
      });

      toggleModal(logModal, false);
      logForm.reset();
      logDateInput.value = new Date().toISOString().split('T')[0];
      await loadDirectory();
      if (teacherName) selectTeacher(teacherName);
    };

    // Quote-aware TSV Parser to handle multi-line cells correctly
    function parseTSV(text) {
      const rows = [];
      let currentRow = [];
      let currentCell = '';
      let insideQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (char === '"') {
          if (insideQuotes && nextChar === '"') {
            currentCell += '"';
            i++; // skip escaped quote
          } else {
            insideQuotes = !insideQuotes;
          }
        } else if (char === '\t' && !insideQuotes) {
          currentRow.push(currentCell.trim());
          currentCell = '';
        } else if ((char === '\r' || char === '\n') && !insideQuotes) {
          if (char === '\r' && nextChar === '\n') i++; // handle CRLF
          currentRow.push(currentCell.trim());
          if (currentRow.some(cell => cell.length > 0)) {
            rows.push(currentRow);
          }
          currentRow = [];
          currentCell = '';
        } else {
          currentCell += char;
        }
      }

      if (currentCell || currentRow.length > 0) {
        currentRow.push(currentCell.trim());
        if (currentRow.some(cell => cell.length > 0)) {
          rows.push(currentRow);
        }
      }

      return rows;
    }

    // TSV Batch Import Parser
    runImportBtn.onclick = async () => {
      const rawText = document.getElementById('import-data').value.trim();
      const division = document.getElementById('import-division').value;
      if (!rawText) return;

      const parsedRows = parseTSV(rawText);
      let importedCount = 0;

      for (let cols of parsedRows) {
        if (cols.length < 3) continue;

        let record = {};
        if (division === 'MSHS') {
          record = {
            timestamp: cols[0] || '', email: cols[1] || '', name: cols[2] || '',
            grade: cols[3] || '', subject: cols[4] || '', studentGoal: cols[5] || '',
            instructionalGoal: cols[6] || '', coPlanningBlocks: cols[7] || '',
            coTeachingBlocks: cols[8] || '', startDate: cols[9] || '',
            flexibleDate: cols[10] || '', partnershipStyle: cols[11] || '',
            division: 'MSHS'
          };
        } else {
          record = {
            timestamp: cols[0] || '', email: cols[1] || '', name: cols[2] || '',
            grade: cols[3] || '', subject: cols[4] || '', studentGoal: cols[5] || '',
            instructionalGoal: cols[6] || '', coPlanningBlocks: cols[7] || '',
            coTeachingBlocks: cols[8] || '', startDate: cols[9] || '',
            flexibleDate: cols[10] || '', partnershipStyle: cols[11] || '',
            month: cols[13] || '', tags: cols[14] || '',
            division: 'EYSES'
          };
        }

        // Only save valid records where name isn't an accidental block list fragment
        if (record.name && !record.name.toLowerCase().includes('block')) {
          await addDoc(collection(db, 'coaching-invites'), record);
          importedCount++;
        }
      }

      alert(`Successfully imported ${importedCount} records.`);
      document.getElementById('import-data').value = '';
      toggleModal(importModal, false);
      await loadDirectory();
    };
  </script>
</body>
</html>
